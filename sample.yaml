def create_business_hub_tables(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
) -> list[str]:
    """Create business hub and same-as link target tables if they do not exist."""
    target_schema: str = f"{config.target_catalog}.{config.target_schema}"
    created: list = []

    spark.sql(f"CREATE SCHEMA IF NOT EXISTS {target_schema}")

    for bhub in config.business_hubs:
        if not bhub.is_active:
            continue

        # Business hub table (hub-style schema — no tenant columns)
        spark.sql(f"""
            CREATE TABLE IF NOT EXISTS {target_schema}.{bhub.table_name} (
                {bhub.hash_key} STRING NOT NULL,
                {bhub.bk_column} STRING NOT NULL,
                ETL_LoadDate TIMESTAMP NOT NULL,
                ETL_RecordSource STRING NOT NULL
            )
            CLUSTER BY ({bhub.hash_key})
            TBLPROPERTIES (
                'delta.columnMapping.mode' = 'name'
            )
        """)
        created.append(bhub.table_name)

        # Same-as links (link-style schema with tenant columns)
        for source_hub in bhub.source_hubs:
            hub_table: str = f"{config.target_catalog}.{config.source_schema}.{source_hub.hub}"
            hub_hash_key: str = _get_hash_key_column(spark.table(hub_table), source_hub.hub)
            link_name: str = f"link_sameas_{bhub.table_name}_{source_hub.source_system}".lower()
            spark.sql(f"""
                CREATE TABLE IF NOT EXISTS {target_schema}.{link_name} (
                    LinkHashKey STRING NOT NULL,
                    {hub_hash_key} STRING NOT NULL,
                    {bhub.hash_key} STRING NOT NULL,
                    ETL_LoadDate TIMESTAMP NOT NULL,
                    ETL_RecordSource STRING NOT NULL,
                    ETL_SourceSystem STRING,
                    ETL_Brand STRING,
                    ETL_Region STRING
                )
                CLUSTER BY (ETL_SourceSystem, ETL_Brand, ETL_Region, LinkHashKey)
                TBLPROPERTIES (
                    'delta.columnMapping.mode' = 'name'
                )
            """)
            created.append(link_name)

    if created:
        print(f"Created {len(created)} business hub tables: {', '.join(created)}")
    return created


def load_business_hubs(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    hub_name: Optional[str] = None,
) -> dict[str, int]:
    """Load business hubs and same-as links from config."""
    target_schema: str = f"{config.target_catalog}.{config.target_schema}"
    results: dict = {}

    hubs_to_load: list[BusinessHubConfig] = [bh for bh in config.business_hubs if bh.is_active]
    if hub_name:
        hubs_to_load: list[BusinessHubConfig] = [bh for bh in hubs_to_load if bh.table_name == hub_name]
        if not hubs_to_load:
            raise ValueError(f"Business hub '{hub_name}' not found in active config")

    for bhub in hubs_to_load:
        # Load bhub rows
        staged_df = _build_business_hub_df(spark, config, bhub)
        staged_view: str = f"stg_{bhub.table_name}"
        staged_df.createOrReplaceTempView(staged_view)
        target_table: str = f"{target_schema}.{bhub.table_name}"

        sql: str = f"""
            INSERT INTO {target_table}
                ({bhub.hash_key}, {bhub.bk_column}, ETL_LoadDate, ETL_RecordSource)
            SELECT
                src.{bhub.hash_key},
                src.{bhub.bk_column},
                current_timestamp(),
                '{config.record_source}'
            FROM {staged_view} src
            LEFT JOIN {target_table} tgt ON tgt.{bhub.hash_key} = src.{bhub.hash_key}
            WHERE tgt.{bhub.hash_key} IS NULL
        """
        result = spark.sql(sql)
        rows = result.first()["num_affected_rows"]
        results[bhub.table_name] = rows
        print(f"  Business hub {bhub.table_name}: {rows} new rows inserted")

        # Load same-as links for each source hub
        for source_hub in bhub.source_hubs:
            link_name: str = f"link_sameas_{bhub.table_name}_{source_hub.source_system}".lower()
            staged_link_df = _build_same_as_link_df(spark, config, bhub, source_hub)
            staged_link_view: str = f"stg_{link_name}"
            staged_link_df.createOrReplaceTempView(staged_link_view)

            hub_table: str = f"{config.target_catalog}.{config.source_schema}.{source_hub.hub}"
            hub_hash_key: str = _get_hash_key_column(spark.table(hub_table), source_hub.hub)
            target_link_table: str = f"{target_schema}.{link_name}"

            sql: str = f"""
                INSERT INTO {target_link_table}
                    (LinkHashKey, {hub_hash_key}, {bhub.hash_key}, ETL_LoadDate,
                     ETL_RecordSource, ETL_SourceSystem, ETL_Brand, ETL_Region)
                SELECT
                    src.LinkHashKey,
                    src.{hub_hash_key},
                    src.{bhub.hash_key},
                    current_timestamp(),
                    '{config.record_source}',
                    '{source_hub.source_system}',
                    '{source_hub.brand}',
                    '{source_hub.region}'
                FROM {staged_link_view} src
                LEFT JOIN {target_link_table} tgt ON tgt.LinkHashKey = src.LinkHashKey
                WHERE tgt.LinkHashKey IS NULL
            """
            result = spark.sql(sql)
            rows = result.first()["num_affected_rows"]
            results[link_name] = rows
            print(f"  Same-as link {link_name}: {rows} new combinations inserted")

    return results


def load_bhub_effectivity_satellites(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    hub_name: Optional[str] = None,
) -> dict[str, int]:
    """Auto-create and load effectivity satellites for same-as links.

    Patterns 1 and 2 receive effectivity satellites using the same activation /
    deactivation state logic as business links. Pattern 3 (immutable) receives
    no effsat.
    """
    target_schema: str = f"{config.target_catalog}.{config.target_schema}"
    results: dict = {}

    hubs_to_process: list[BusinessHubConfig] = [bh for bh in config.business_hubs if bh.is_active]
    if hub_name:
        hubs_to_process: list[BusinessHubConfig] = [bh for bh in hubs_to_process if bh.table_name == hub_name]

    for bhub in hubs_to_process:
        for source_hub in bhub.source_hubs:
            if source_hub.relationship_pattern not in (1, 2):
                continue

            link_name: str = f"link_sameas_{bhub.table_name}_{source_hub.source_system}".lower()
            effsat_name: str = f"{source_hub.source_system}_effsat_{link_name}_{source_hub.brand}".lower()
            effsat_table: str = f"{target_schema}.{effsat_name}"

            spark.sql(f"""
                CREATE TABLE IF NOT EXISTS {effsat_table} (
                    LinkHashKey STRING NOT NULL,
                    IsActive BOOLEAN NOT NULL,
                    ETL_SourceSystem STRING,
                    ETL_Brand STRING,
                    ETL_Region STRING,
                    ETL_LoadDate TIMESTAMP NOT NULL,
                    ETL_RecordSource STRING NOT NULL,
                    ETL_EndDate TIMESTAMP
                )
                CLUSTER BY (ETL_SourceSystem, ETL_Brand, ETL_Region, LinkHashKey)
                TBLPROPERTIES (
                    'delta.columnMapping.mode' = 'name'
                )
            """)

            expected_df = _build_same_as_link_df(spark, config, bhub, source_hub)
            expected_view: str = f"expected_{link_name}"
            expected_df.createOrReplaceTempView(expected_view)

            sql: str = f"""
                WITH current_active AS (
                    SELECT LinkHashKey
                    FROM {effsat_table}
                    WHERE IsActive = TRUE AND ETL_EndDate IS NULL
                      AND ETL_SourceSystem = '{source_hub.source_system}'
                      AND ETL_Brand = '{source_hub.brand}'
                      AND ETL_Region = '{source_hub.region}'
                ),
                activations AS (
                    SELECT e.LinkHashKey, TRUE AS IsActive
                    FROM {expected_view} e
                    LEFT JOIN current_active ca ON ca.LinkHashKey = e.LinkHashKey
                    WHERE ca.LinkHashKey IS NULL
                ),
                deactivations AS (
                    SELECT ca.LinkHashKey, FALSE AS IsActive
                    FROM current_active ca
                    LEFT JOIN {expected_view} e ON e.LinkHashKey = ca.LinkHashKey
                    WHERE e.LinkHashKey IS NULL
                ),
                changes AS (
                    SELECT * FROM activations
                    UNION ALL
                    SELECT * FROM deactivations
                )
                INSERT INTO {effsat_table}
                    (LinkHashKey, IsActive, ETL_SourceSystem, ETL_Brand, ETL_Region,
                     ETL_LoadDate, ETL_RecordSource, ETL_EndDate)
                SELECT
                    c.LinkHashKey,
                    c.IsActive,
                    '{source_hub.source_system}',
                    '{source_hub.brand}',
                    '{source_hub.region}',
                    current_timestamp(),
                    '{config.record_source}',
                    CAST(NULL AS TIMESTAMP)
                FROM changes c
            """
            result = spark.sql(sql)
            rows = result.first()["num_affected_rows"]
            results[effsat_name] = rows

            spark.sql(f"""
                MERGE INTO {effsat_table} AS target
                USING (
                    SELECT LinkHashKey, MAX(ETL_LoadDate) AS latest_load_date
                    FROM {effsat_table}
                    WHERE ETL_EndDate IS NULL
                      AND ETL_SourceSystem = '{source_hub.source_system}'
                      AND ETL_Brand = '{source_hub.brand}'
                      AND ETL_Region = '{source_hub.region}'
                    GROUP BY LinkHashKey
                    HAVING COUNT(*) > 1
                ) AS src
                ON target.LinkHashKey = src.LinkHashKey
                    AND target.ETL_EndDate IS NULL
                    AND target.ETL_LoadDate < src.latest_load_date
                    AND target.ETL_SourceSystem = '{source_hub.source_system}'
                    AND target.ETL_Brand = '{source_hub.brand}'
                    AND target.ETL_Region = '{source_hub.region}'
                WHEN MATCHED THEN UPDATE SET ETL_EndDate = current_timestamp()
            """)

            if rows > 0:
                print(f"  Business hub effsat {effsat_name}: {rows} state changes recorded")
            else:
                print(f"  Business hub effsat {effsat_name}: no state changes")

    return results


def run_business_hubs(
    spark: SparkSession,
    config_path: str,
    hub_name: Optional[str] = None,
    catalog_name: Optional[str] = None,
) -> dict[str, int]:
    """Standalone entry point for business hub processing."""
    config: BusinessSatelliteConfig = load_business_satellite_config(config_path)
    if catalog_name:
        config.target_catalog = catalog_name

    if not config.business_hubs:
        print("No business hubs defined in config - skipping.")
        return {}

    create_business_hub_tables(spark, config)
    results: dict[str, int] = load_business_hubs(spark, config, hub_name=hub_name)
    load_bhub_effectivity_satellites(spark, config, hub_name=hub_name)
    return results


def load_business_satellites(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    satellite_name: Optional[str] = None,
) -> dict[str, int]:
    """Load business satellites from config - insert new transformed versions only."""

    target_schema: str = f"{config.target_catalog}.{config.target_schema}"
    results: dict = {}

    satellites_to_load: list[BusinessSatelliteEntityConfig] = [sat for sat in config.satellites if sat.is_active]
    if satellite_name:
        satellites_to_load: list[BusinessSatelliteEntityConfig] = [sat for sat in satellites_to_load if sat.table_name == satellite_name]
        if not satellites_to_load:
            raise ValueError(f"Business satellite '{satellite_name}' not found in active config")

    for satellite in satellites_to_load:
        staged_df = build_satellite_dataframe(spark, config, satellite.table_name)
        staged_view: str = f"stg_{satellite.table_name}"
        staged_df.createOrReplaceTempView(staged_view)

        target_table: str = f"{target_schema}.{satellite.table_name}"
        active_attributes: list[BusinessAttributeConfig] = [attr for attr in satellite.attributes if attr.is_active]
        attribute_columns: list[str] = [attribute.target_column for attribute in active_attributes]
        insert_columns: list[str] = [
            satellite.parent_key_column,
            "ETL_LoadDate",
            "ETL_EndDate",
            "ETL_HashDiff",
            "ETL_RecordSource",
            "ETL_RecordStatus",
            *attribute_columns,
            *REQUIRED_TENANT_COLUMNS,
        ]
        insert_clause: str = ", ".join(insert_columns)
        attribute_clause: str = ",\n                ".join(f"src.{column}" for column in attribute_columns)
        tenant_clause: str = ",\n                ".join(f"src.{col}" for col in REQUIRED_TENANT_COLUMNS)

        sql: str = f"""
            WITH latest_target AS (
                SELECT {satellite.parent_key_column}, ETL_HashDiff
                FROM {target_table}
                WHERE ETL_EndDate IS NULL
            )
            INSERT INTO {target_table} ({insert_clause})
            SELECT
                src.{satellite.parent_key_column},
                src.ETL_LoadDate,
                CAST(NULL AS TIMESTAMP) AS ETL_EndDate,
                src.ETL_HashDiff,
                src.ETL_RecordSource,
                src.ETL_RecordStatus,
                {attribute_clause},
                {tenant_clause}
            FROM {staged_view} src
            LEFT JOIN latest_target tgt
                ON tgt.{satellite.parent_key_column} = src.{satellite.parent_key_column}
            WHERE tgt.{satellite.parent_key_column} IS NULL
                OR tgt.ETL_HashDiff != src.ETL_HashDiff
        """

        result = spark.sql(sql)
        rows = result.first()["num_affected_rows"]
        results[satellite.table_name] = rows
        print(f"  Business satellite {satellite.table_name}: {rows} new versions inserted")

    close_business_satellite_versions(
        spark,
        config,
        satellite_name=satellite_name,
    )

    return results


