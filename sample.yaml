# Bronze Extract Configuration - Chargebee (SiteDocs)
#
# Source: Chargebee REST API v2, via rest_connectors.chargebee.ChargebeeConnector
#
# Scope: 6 objects (customers, plans, subscriptions, invoices, addons, coupons).
# Column lists below are the full source schema per table (minus Stitch
# pipeline metadata columns _sdc_table_version, _sdc_received_at,
# _sdc_sequence, _sdc_batched_at, which are artifacts of the old ingestion
# tool and do not exist on the Chargebee API response itself).
#
# All tables' `id` is the Chargebee-assigned primary key. customers/
# subscriptions/invoices/coupons carry a `deleted` BOOL; addons/plans do not.
#
# IMPORTANT - epoch timestamps: confirmed against a live API sample
# that every date/time field (created_at,
# updated_at, current_term_start, due_date, etc.) comes back as a raw Unix
# epoch INTEGER, e.g. "updated_at": 1788402637 - not an ISO string. The old
# BigQuery/Stitch schema this config was originally built from typed these as
# TIMESTAMP, which was a property of that ingestion tool's own conversion, not
# the live Chargebee API. They are typed `bigint` here instead, because
# loader.py's _cast_columns does F.col(...).try_cast(data_type), and
# try_cast(<epoch-as-string>, "timestamp") returns NULL - it does not
# interpret a numeric string as epoch seconds. Typing as timestamp would
# silently null out every date/time field in bronze.
#
# OPEN FRAMEWORK QUESTION (not resolved in this config - needs Davis/Glenn):
# watermark.get_bronze_watermark() does val.strftime(...) assuming the
# watermark column reads back as a Python datetime. With updated_at typed
# bigint, val is a plain int, .strftime() will raise, and the function's
# except Exception catches it and returns None - meaning this connector would
# silently fall back to a full load every run instead of an error. That's
# safe (no wrong data) but expensive, and defeats "incremental" here. This
# needs either: (a) a bigint-aware branch in get_bronze_watermark, or (b) the
# Chargebee connector converting epoch to a real timestamp before it lands in
# bronze, and re-converting back to epoch when building the updated_at[after]
# API filter. Do not silently pick one without confirming with the team -
# get_bronze_watermark is shared framework code other sources rely on.

source_system: chargebee
environment: prod_sitedocs
brand: SiteDocs
region: US
target_catalog: bbdatawarehouse_dev
target_schema: bronze

