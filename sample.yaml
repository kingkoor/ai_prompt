 Enable Delta column mapping (name mode) on newly created tables

Set delta.columnMapping.mode = 'name' wherever the framework creates a table,
so columns can later be renamed or dropped without rebuilding the table.
Only affects tables created from now on; existing tables are handled by a
separate one-time ALTER script.

Title: ##### Enable Delta column mapping on table creation

## Why
Without column mapping, Delta tables can't rename or drop columns. Removing old
columns (e.g. GoCanvas fact_contacts, DODE-2173/2174) required dropping and
rebuilding the whole table. With 'name' mode we can do ALTER TABLE ... DROP/RENAME COLUMN.

