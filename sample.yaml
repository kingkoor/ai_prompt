#Gold Layer Configuration - Salesforce (GoCanvas / US)
#Run sync_gold_metadata_runner.py to push changes into the metadata tables.

source_system: salesforce
brand: GoCanvas
region: US
target_catalog: bbdatawarehouse_dev
source_schema: silver
target_schema: gold

tables:

  # ----------------------------------------------------------------------
  # DIMENSIONS — UNRESTRICTED
  # ----------------------------------------------------------------------

  - table_name: salesforce_dim_accounts
    table_type: dim
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_accounts
    key_column: AccountKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_bsat_accounts_gocanvas_us
        satellite_type: business
        columns:
          - source: AccountIsDeleted
          - source: AccountWebsite
          - source: AccountLBLZuoraBillingAccountID
          - source: AccountDeviceMagicExternalID
          - source: AccountBillingIDBackup
          - source: AccountID18
          - source: AccountBillingRegion
          - source: AccountBookSegment
          - source: AccountPartnerType
          - source: AccountManaged
          - source: AccountSnowballWriteOffDate
          - source: AccountLastActivityDate
          - source: AccountCreatedDate
          - source: AccountLastModifiedDate
          - source: AccountSystemModstamp

  - table_name: salesforce_dim_contacts
    table_type: dim
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_contacts
    key_column: ContactKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_bsat_contacts_gocanvas_us
        satellite_type: business
        columns:
          - source: ContactIsDeleted
          - source: ContactSalutation
          - source: ContactTitle
          - source: ContactDepartment
          - source: ContactLeadSource
          - source: ContactDescription
          - source: ContactReportsToId
          - source: ContactLastActivityDate
          - source: ContactCreatedDate
          - source: ContactLastModifiedDate
          - source: ContactSystemModstamp

  - table_name: salesforce_dim_users
    table_type: dim
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_users
    key_column: UserKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_bsat_users_gocanvas_us
        satellite_type: business
        columns:
          - source: UserCompanyName
          - source: UserDivision
          - source: UserDepartment
          - source: UserTitle
          - source: UserSenderName
          - source: UserSignature
          - source: UserAlias
          - source: UserCommunityNickname
          - source: UserIsActive
          - source: UserTimeZoneSidCode
          - source: UserLocaleSidCode
          - source: UserCurrencyISOCode
          - source: UserType
          - source: UserLanguageLocaleCode
          - source: UserEmployeeNumber
          - source: UserSuAccessExpirationDate
          - source: UserFederationIdentifier
          - source: UserChurnZeroAccess
          - source: UserAnniversary
          - source: UserTeamLead
          - source: UserRoleName
          - source: UserProfileName
          - source: UserSalesSegmentation
          - source: UserStartDate
          - source: UserCreatedDate
          - source: UserLastModifiedDate
          - source: UserSystemModstamp

  # ----------------------------------------------------------------------
  # DIMENSIONS — RESTRICTED
  # ----------------------------------------------------------------------

  - table_name: salesforce_dim_accounts_restricted
    table_type: dim
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_accounts
    key_column: AccountRestrictedKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_bsat_accounts_restricted_gocanvas_us
        satellite_type: business
        columns:
          - source: AccountName
          - source: AccountPhone
          - source: AccountFax
          - source: AccountGoCanvasUsername
          - source: AccountOwnersManager
          - source: AccountManagerText
          - source: AccountFullName
          - source: AccountPreviousOwner1
          - source: AccountPreviousOwner2

  - table_name: salesforce_dim_contacts_restricted
    table_type: dim
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_contacts
    key_column: ContactRestrictedKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_bsat_contacts_restricted_gocanvas_us
        satellite_type: business
        columns:
          - source: ContactFirstName
          - source: ContactLastName
          - source: ContactName
          - source: ContactEmail
          - source: ContactPhone
          - source: ContactMobilePhone
          - source: ContactHomePhone
          - source: ContactOtherPhone
          - source: ContactFax
          - source: ContactAssistantName
          - source: ContactAssistantPhone

  - table_name: salesforce_dim_users_restricted
    table_type: dim
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_users
    key_column: UserRestrictedKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_bsat_users_restricted_gocanvas_us
        satellite_type: business
        columns:
          - source: UserUsername
          - source: UserLastName
          - source: UserFirstName
          - source: UserName
          - source: UserEmail
          - source: UserSenderEmail
          - source: UserPhone
          - source: UserFax
          - source: UserMobilePhone
          - source: UserExtension
          - source: UserLBLAlternativePhone
          - source: UserQualifiedMeetingBookerName

  - table_name: salesforce_fact_user_addresses
    table_type: fact
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_users
    key_column: UserKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_bsat_users_restricted_gocanvas_us
        satellite_type: business
        columns:
          - source: UserStreetNormalized
          - source: UserCityNormalized
          - source: UserStateNormalized
          - source: UserPostalCodeNormalized
          - source: UserCountryNormalized
          # address key (dim_addresses) - 'Restricted' in the column name so the
          # column-level masking policy applies to it
          - source: UserAddressKey
            target: UserAddressRestrictedKey
          - source: HubUserHashKey
            target: UserRestrictedKey
  # ----------------------------------------------------------------------
  # FACTS
  # ----------------------------------------------------------------------

  - table_name: salesforce_fact_accounts
    table_type: fact
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_accounts
    key_column: AccountKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_bsat_accounts_gocanvas_us
        satellite_type: business
        columns:
          - source: AccountARRFromCMRR
          - source: AccountPreviousMonthsARR
          - source: AccountMonthlyARRChange
          - source: AccountTodaysARR
          - source: AccountChurnscore
          - source: AccountDeviceMagicPrimaryChurnscore
          - source: AccountSeatsPurchased
          - source: HubAccountHashKey
            target: AccountRestrictedKey
    foreign_keys:
      - link: salesforce_link_account_user_owner
        hub_key: HubUserHashKey
        fk_column: AccountOwnerUserKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_account_user_owner_gocanvas
        join_type: LEFT
      - link: salesforce_link_account_user_owner
        hub_key: HubUserHashKey
        fk_column: AccountOwnerUserRestrictedKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_account_user_owner_gocanvas
        join_type: LEFT
      - link: salesforce_link_account_user_previous_account_owner
        hub_key: HubUserHashKey
        fk_column: AccountPreviousOwnerUserKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_account_user_previous_account_owner_gocanvas
        join_type: LEFT
      - link: salesforce_link_account_user_previous_account_owner
        hub_key: HubUserHashKey
        fk_column: AccountPreviousOwnerUserRestrictedKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_account_user_previous_account_owner_gocanvas
        join_type: LEFT
      - link: salesforce_link_account_user_account_manager
        hub_key: HubUserHashKey
        fk_column: AccountManagerUserKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_account_user_account_manager_gocanvas
        join_type: LEFT
      - link: salesforce_link_account_user_account_manager
        hub_key: HubUserHashKey
        fk_column: AccountManagerUserRestrictedKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_account_user_account_manager_gocanvas
        join_type: LEFT
      - link: salesforce_link_account_user_technical_account_manager
        hub_key: HubUserHashKey
        fk_column: AccountTechnicalManagerUserKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_account_user_technical_account_manager_gocanvas
        join_type: LEFT
      - link: salesforce_link_account_user_technical_account_manager
        hub_key: HubUserHashKey
        fk_column: AccountTechnicalManagerUserRestrictedKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_account_user_technical_account_manager_gocanvas
        join_type: LEFT

  - table_name: salesforce_fact_contacts
    table_type: fact
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_contacts
    key_column: ContactKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_bsat_contacts_gocanvas_us
        satellite_type: business
        columns:
          - source: ContactLastActivityDateKey
          - source: ContactCreatedDateKey
          - source: ContactLastModifiedDateKey
          - source: ContactSystemModstampKey
          - source: HubContactHashKey
            target: ContactRestrictedKey
    foreign_keys:
      - link: salesforce_link_contact_account
        hub_key: HubAccountHashKey
        fk_column: ContactAccountKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_contact_account_gocanvas
        join_type: LEFT
      - link: salesforce_link_contact_account
        hub_key: HubAccountHashKey
        fk_column: ContactAccountRestrictedKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_contact_account_gocanvas
        join_type: LEFT
      - link: salesforce_link_contact_user_owner
        hub_key: HubUserHashKey
        fk_column: ContactOwnerUserKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_contact_user_owner_gocanvas
        join_type: LEFT
      - link: salesforce_link_contact_user_owner
        hub_key: HubUserHashKey
        fk_column: ContactOwnerUserRestrictedKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_contact_user_owner_gocanvas
        join_type: LEFT

  - table_name: salesforce_fact_contact_addresses
    table_type: fact
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_contacts
    key_column: ContactKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_bsat_contacts_restricted_gocanvas_us
        satellite_type: business
        columns:
        #mailing address
          - source: ContactMailingStreetNormalized
          - source: ContactMailingCityNormalized
          - source: ContactMailingStateNormalized
          - source: ContactMailingPostalCodeNormalized
          - source: ContactMailingCountryNormalized
        #other address
          - source: ContactOtherStreetNormalized
          - source: ContactOtherCityNormalized
          - source: ContactOtherStateNormalized
          - source: ContactOtherPostalCodeNormalized
          - source: ContactOtherCountryNormalized
          # address keys (dim_addresses) - 'Restricted' in the column name so the
          # column-level masking policy applies to them
          - source: ContactMailingAddressKey
            target: ContactMailingAddressRestrictedKey
          - source: ContactOtherAddressKey
            target: ContactOtherAddressRestrictedKey
          - source: HubContactHashKey
            target: ContactRestrictedKey
