SELECT table_schema, table_name, column_name, data_type
FROM <prod_catalog>.information_schema.columns
WHERE table_schema IN ('bronze', 'silver', 'gold')
  AND lower(column_name) LIKE '%birth%'
ORDER BY table_schema, table_name, column_name;

# Databricks notebook source
# DODE-2185 post-deployment: drop the unused birthdate columns.
# The columns are already removed from the YAML configs and are 100% empty.
# Finds every column whose name contains "birth" in the given schemas and drops it.
# Requires column mapping by name (DODE-2058); the script sets it if missing.
# Run once per environment. Safe to re-run: nothing is found the second time.
# Start with dry_run = true, review the list, then run with dry_run = false.

dbutils.widgets.text("catalog_name", "bbdatawarehouse_dev", "Catalog Name")
dbutils.widgets.text("schemas", "bronze,silver,gold", "Schemas (comma-separated)")
dbutils.widgets.dropdown("dry_run", "true", ["true", "false"], "Dry run")

catalog = dbutils.widgets.get("catalog_name")
schemas = [s.strip() for s in dbutils.widgets.get("schemas").split(",") if s.strip()]
dry_run = dbutils.widgets.get("dry_run") == "true"

columns = spark.sql(f"""
    SELECT c.table_schema, c.table_name, c.column_name
    FROM {catalog}.information_schema.columns c
    JOIN {catalog}.information_schema.tables t
      ON t.table_schema = c.table_schema AND t.table_name = c.table_name
    WHERE c.table_schema IN ({", ".join(f"'{s}'" for s in schemas)})
      AND lower(c.column_name) LIKE '%birth%'
      AND t.table_type IN ('MANAGED', 'EXTERNAL')
    ORDER BY c.table_schema, c.table_name, c.column_name
""").collect()

done, failed = [], []

for row in columns:
    full_name = f"{catalog}.{row.table_schema}.{row.table_name}"
    target = f"{full_name}.{row.column_name}"

    if dry_run:
        print(f"WOULD DROP  {target}")
        done.append(target)
        continue

    try:
        props = {r.key: r.value for r in spark.sql(f"SHOW TBLPROPERTIES {full_name}").collect()}
        if props.get("delta.columnMapping.mode") != "name":
            spark.sql(f"ALTER TABLE {full_name} SET TBLPROPERTIES ('delta.columnMapping.mode' = 'name')")

        drop_sql = f"""
        ALTER TABLE {full_name} DROP COLUMN {row.column_name}
        """
        spark.sql(drop_sql)
        print(f"DONE  {target}")
        done.append(target)
    except Exception as e:
        print(f"FAILED  {target}: {e}")
        failed.append(target)

print(f"\n{'Dry run - ' if dry_run else ''}{len(done)} column(s) to drop/dropped, {len(failed)} failed")
if failed:
    raise RuntimeError(f"Drop failed for {len(failed)} column(s): {failed}")
