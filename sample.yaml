"""Gold layer loader: builds and executes SQL for gold dim/fact tables.

Entry point:
    from gold_metadata.loader import run
    run(spark, config)

The loader resolves vault join keys from YAML configs at startup (vault
and/or business satellite configs as needed), then builds and executes a
SELECT query per gold table.

Currently supported:
    table_type:      dim, fact      (hierarchy_bridge → NotImplementedError)
    load_mode:       full_refresh, incremental (falls back to partition overwrite)
    load_type:       active, active_plus, historical
    anchor:          hub-based and link-based tables
    satellite_type:  vault, business

FK resolution supports three strategies:
    effectivity_satellite:  subquery INNER JOIN link+effsat WHERE IsActive=true AND ETL_EndDate IS NULL
    driving_key:            ROW_NUMBER subquery selecting latest link row
    plain:                  direct link join (neither effsat nor driving_key)
"""

from __future__ import annotations

import logging
from dataclasses import dataclass
import pyspark.sql.functions as F
from pyspark.sql import DataFrame, SparkSession
from pyspark.sql.types import StructType

from gold_metadata.config import (
    GoldChainJoinConfig,
    GoldColumnConfig,
    GoldConfig,
    GoldForeignKeyConfig,
    GoldSatelliteConfig,
    GoldTableConfig,
    PARTITION_COLUMNS,
)
from datavault_util.sentinel import SENTINEL_DEFINITIONS, SENTINEL_ID_BY_LABEL, SENTINEL_TYPE_MAPS


# ----------------------------------------------------------------------------
# Vault metadata — loaded once per run
# ----------------------------------------------------------------------------


@dataclass
class _VaultMeta:
    """Pre-loaded vault metadata lookups."""

    hub_hash_keys: dict[str, str]    # hub_table_name → hash_key_name
    sat_parent_keys: dict[str, str]  # sat_table_name → parent_key
    # Note: all link tables use the fixed column name "LinkHashKey" — no lookup.


def _load_vault_meta(
    spark: SparkSession,
    catalog_name: str,
    vault_config_path: str | None = None,
    bsat_config_path: str | list[str] | None = None,
) -> _VaultMeta:
    """Load hub hash key and satellite parent key lookups from YAML configs.

    Resolves lookups from the provided vault and/or business satellite YAML
    configs. Only loads from configs that are provided — callers are
    responsible for validating that the needed paths are supplied (see
    _validate_config_paths in run()).

    Args:
        spark: Active SparkSession (unused but kept for interface consistency).
        catalog_name: Target catalog (unused but kept for interface consistency).
        vault_config_path: Workspace path to the vault config YAML.
        bsat_config_path: Workspace path(s) to business satellite config YAML(s).
            Accepts a single string or a list of strings when multiple bsat
            configs are needed (e.g., source-system bsat + conformed bsat).
    """
    hub_hash_keys: dict[str, str] = {}
    sat_parent_keys: dict[str, str] = {}

    if vault_config_path:
        from datavault_util.config import load_vault_config

        vault_config = load_vault_config(vault_config_path)
        hub_hash_keys = {
            hub.table_name: hub.hash_key_name
            for hub in vault_config.hubs
            if hub.is_active
        }
        sat_parent_keys = {
            sat.table_name: sat.parent_key
            for sat in vault_config.satellites
            if sat.is_active
        }

    # Normalize bsat_config_path to a list for uniform iteration.
    bsat_paths: list[str] = []
    if isinstance(bsat_config_path, str):
        bsat_paths = [bsat_config_path]
    elif isinstance(bsat_config_path, list):
        bsat_paths = bsat_config_path

    if bsat_paths:
        from business_satellite_metadata.config import load_business_satellite_config

        for path in bsat_paths:
            bsat_config = load_business_satellite_config(path)
            for bsat in bsat_config.satellites:
                if bsat.is_active:
                    sat_parent_keys[bsat.table_name] = bsat.parent_key_column
            # Business hub hash keys — needed when a gold table is anchored
            # on a bhub (e.g., dim_product_conformed → bhub_product).
            for bhub in bsat_config.business_hubs:
                if bhub.is_active:
                    hub_hash_keys[bhub.table_name] = bhub.hash_key

    return _VaultMeta(
        hub_hash_keys=hub_hash_keys,
        sat_parent_keys=sat_parent_keys,
    )


logger = logging.getLogger(__name__)


# ----------------------------------------------------------------------------
# Not Applicable sentinel alignment (multi-tenant column backfill)
# ----------------------------------------------------------------------------
# When tenants share a gold table but contribute different column sets, columns
# not present in the writing DataFrame arrive as NULL.  Before writing, we
# inspect the target table's schema and backfill any missing columns with the
# standard "Not Applicable" sentinel values below (sourced from the DataValues
# dimension — sentinel key -2).

_NOT_APPLICABLE_SENTINEL_MAP: dict[type, object] = SENTINEL_TYPE_MAPS["Not Applicable"]

# Columns managed by the loader / partition scheme — never sentinel-filled.
_SENTINEL_EXCLUDE: frozenset[str] = frozenset(PARTITION_COLUMNS) | frozenset({
    "ETL_LoadDate", "ETL_RecordSource", "ETL_EndDate", "ETL_RecordStatus",
    "ETLEffectiveFrom", "ETLEffectiveTo", "IsCurrent",
})

_UNKNOWN_SENTINEL_ID: str = SENTINEL_ID_BY_LABEL["Unknown"]


def _append_sentinel_rows(
    spark: SparkSession,
    df: DataFrame,
    config: GoldConfig,
    table: GoldTableConfig,
) -> DataFrame:
    """Append 4 sentinel rows to a gold dimension. Each sentinel gets a unique
    hash key (MD5 of its numeric ID) and type-aware defaults for all columns."""
    schema = df.schema
    partition_values: dict[str, str] = {
        "ETL_SourceSystem": table.source_system or config.source_system,
        "ETL_Brand": config.brand,
        "ETL_Region": config.region,
    }

    sentinel_dfs: list = []
    for label, sentinel_id in SENTINEL_DEFINITIONS:
        type_map: dict[type, object] = SENTINEL_TYPE_MAPS[label]
        exprs: list = []
        for field in schema.fields:
            name = field.name

            if name == table.key_column:
                exprs.append(F.md5(F.lit(str(sentinel_id))).alias(name))
            elif name in partition_values:
                exprs.append(F.lit(partition_values[name]).alias(name))
            else:
                value: object | None = type_map.get(type(field.dataType))
                exprs.append(F.lit(value).cast(field.dataType).alias(name))

        sentinel_dfs.append(spark.range(1).select(*exprs))

    result = df
    for sentinel_df in sentinel_dfs:
        result = result.unionByName(sentinel_df)

    print(f"  [{table.table_name}] Appended {len(SENTINEL_DEFINITIONS)} sentinel rows")
    return result


def _align_missing_columns(
    df: DataFrame,
    spark: SparkSession,
    config: GoldConfig,
    table_name: str,
) -> DataFrame:
    """Add columns present in the target table but absent from *df*, filling
    each with the "Not Applicable" sentinel value based on data type, then
    reorder columns to match the target table's schema.

    If the target table does not yet exist (first-ever load), returns *df*
    unchanged — there is no schema to align against.

    Args:
        df: The DataFrame about to be written.
        spark: Active SparkSession.
        config: GoldConfig for this tenant.
        table_name: Gold table name (without catalog/schema prefix).

    Returns:
        A new DataFrame with missing columns added, sentinel-filled, and
        reordered to match the target table's column order.
    """
    full_target: str = f"{config.target_catalog}.{config.target_schema}.{table_name}"

    if not spark.catalog.tableExists(full_target):
        return df

    target_schema: StructType = spark.table(full_target).schema
    df_columns: set = {c.upper() for c in df.columns}
    added: list[str] = []

    for field in target_schema.fields:
        if field.name.upper() in df_columns:
            continue
        if field.name in _SENTINEL_EXCLUDE:
            continue

        sentinel: object | None = _NOT_APPLICABLE_SENTINEL_MAP.get(type(field.dataType))
        if sentinel is not None:
            df = df.withColumn(field.name, F.lit(sentinel).cast(field.dataType))
        else:
            # Unmapped type — add as typed NULL so schema still aligns
            logger.warning(
                "No sentinel defined for column '%s' (type %s) — defaulting to NULL.",
                field.name,
                field.dataType.simpleString(),
            )
            df = df.withColumn(field.name, F.lit(None).cast(field.dataType))
        added.append(field.name)

    if added:
        print(
            f"  [{table_name}] Sentinel-filled {len(added)} missing column(s): "
            f"{', '.join(added)}"
        )

    # Reorder columns to match the target table's schema.  Columns present in
    # the DataFrame but not yet in the target (schema evolution via mergeSchema)
    # are appended at the end so existing column positions remain stable.
    target_col_names: list = [f.name for f in target_schema.fields]
    target_col_upper: set = {n.upper() for n in target_col_names}
    df_col_upper_map: dict = {c.upper(): c for c in df.columns}

    ordered: list = [df_col_upper_map[n.upper()] for n in target_col_names
                     if n.upper() in df_col_upper_map]
    extra: list = [c for c in df.columns if c.upper() not in target_col_upper]
    df = df.select(*(ordered + extra))

    return df


# ----------------------------------------------------------------------------
# Column expression builders
# ----------------------------------------------------------------------------


def _col_expr(col: GoldColumnConfig, sat_alias: str) -> str:
    """Build a single SELECT expression for a gold column config."""
    src: str = f"{sat_alias}.{col.source}"
    if col.transform:
        expr: str = col.transform.replace("{col}", src)
        alias: str = col.target or col.source
        return f"{expr} AS {alias}"
    if col.target and col.target != col.source:
        return f"{src} AS {col.target}"
    return src


_ETL_COLS: frozenset[str] = frozenset({
    "ETL_SourceSystem", "ETL_Brand", "ETL_Region",
    "ETL_LoadDate", "ETL_RecordSource", "ETL_EndDate", "ETL_RecordStatus",
})


def _sat_col_exprs(
    spark: SparkSession,
    sat: GoldSatelliteConfig,
    sat_alias: str,
    parent_key: str,
    sat_full_path: str,
) -> list[str]:
    """Build SELECT expressions for a satellite — explicit columns or all."""
    if sat.columns is None:
        return []  # Bridge satellite — join only, no columns
    if sat.columns:
        return [_col_expr(c, sat_alias) for c in sat.columns]
    # Empty columns list → select all non-ETL, non-key columns
    skip: frozenset[str] = _ETL_COLS | {parent_key}
    return [
        f"{sat_alias}.{f.name}"
        for f in spark.table(sat_full_path).schema.fields
        if f.name not in skip
    ]


# ----------------------------------------------------------------------------
# JOIN clause builders
# ----------------------------------------------------------------------------


def _primary_sat_join(
    sat_name: str,
    sat_alias: str,
    anchor_key_expr: str,
    parent_key: str,
    load_type: str,
    brand: str,
    region: str,
    source_full: str,
) -> str:
    """INNER JOIN clause for the primary (ordinal 1) satellite."""
    conditions: list[str] = [
        f"{sat_alias}.ETL_Brand = '{brand}'",
        f"{sat_alias}.ETL_Region = '{region}'",
    ]
    if load_type in ("active", "active_plus"):
        conditions.append(f"{sat_alias}.ETL_EndDate IS NULL")
    if load_type == "active":
        conditions.append(
            f"{sat_alias}.ETL_RecordStatus NOT IN ('soft_deleted', 'hard_deleted')"
        )
    cond_str: str = "\n        AND ".join(conditions)
    return (
        f"INNER JOIN {source_full}.{sat_name} {sat_alias}\n"
        f"    ON {anchor_key_expr} = {sat_alias}.{parent_key}\n"
        f"    AND {cond_str}"
    )


def _secondary_sat_join(
    sat_name: str,
    sat_alias: str,
    anchor_key_expr: str,
    parent_key: str,
    load_type: str,
    brand: str,
    region: str,
    source_full: str,
) -> str:
    """LEFT JOIN clause for secondary (ordinal 2+) satellites.

    Historical mode uses a PIT bracket join anchored to sat0.ETL_LoadDate.
    """
    if load_type == "historical":
        return (
            f"LEFT JOIN {source_full}.{sat_name} {sat_alias}\n"
            f"    ON {anchor_key_expr} = {sat_alias}.{parent_key}\n"
            f"    AND {sat_alias}.ETL_Brand = '{brand}'\n"
            f"    AND {sat_alias}.ETL_Region = '{region}'\n"
            f"    AND {sat_alias}.ETL_LoadDate <= sat0.ETL_LoadDate\n"
            f"    AND ({sat_alias}.ETL_EndDate > sat0.ETL_LoadDate"
            f" OR {sat_alias}.ETL_EndDate IS NULL)"
        )
    return (
        f"LEFT JOIN {source_full}.{sat_name} {sat_alias}\n"
        f"    ON {anchor_key_expr} = {sat_alias}.{parent_key}\n"
        f"    AND {sat_alias}.ETL_Brand = '{brand}'\n"
        f"    AND {sat_alias}.ETL_Region = '{region}'\n"
        f"    AND {sat_alias}.ETL_EndDate IS NULL"
    )


def _chain_sat_join(
    sat_name: str,
    sat_alias: str,
    parent_sat_alias: str,
    left_key: str,
    right_key: str,
    load_type: str,
    brand: str,
    region: str,
    source_full: str,
    join_type: str = "LEFT",
) -> str:
    """JOIN clause for a chain-joined satellite (joins to another satellite, not the hub).

    For historical mode, uses a PIT bracket join anchored to the parent
    satellite's ETL_LoadDate rather than sat0, maintaining point-in-time
    correctness through the chain.
    """
    conditions: list[str] = [
        f"{parent_sat_alias}.{left_key} = {sat_alias}.{right_key}",
        f"{sat_alias}.ETL_Brand = '{brand}'",
        f"{sat_alias}.ETL_Region = '{region}'",
    ]
    if load_type == "historical":
        conditions.extend([
            f"{sat_alias}.ETL_LoadDate <= {parent_sat_alias}.ETL_LoadDate",
            f"({sat_alias}.ETL_EndDate > {parent_sat_alias}.ETL_LoadDate"
            f" OR {sat_alias}.ETL_EndDate IS NULL)",
        ])
    elif load_type in ("active", "active_plus"):
        conditions.append(f"{sat_alias}.ETL_EndDate IS NULL")
    if load_type == "active":
        conditions.append(
            f"{sat_alias}.ETL_RecordStatus NOT IN ('soft_deleted', 'hard_deleted')"
        )
    cond_str: str = "\n        AND ".join(conditions)
    return (
        f"{join_type} JOIN {source_full}.{sat_name} {sat_alias}\n"
        f"    ON {cond_str}"
    )


def _fk_join_and_expr(
    fk: GoldForeignKeyConfig,
    hub_hash_key: str,
    source_full: str,
    idx: int,
) -> tuple[str, str]:
    """Build FK resolution JOIN clause(s) and SELECT expression.

    Returns:
        (join_sql, select_expr) — join_sql may contain one or two JOINs when
        ``fk.via`` is set (2-hop FK chain through a same-as link).
        select_expr is the column alias for SELECT.

    Single-hop (via is None):
        lnk_{idx}.{hub_key} AS {fk_column}

    Two-hop (via is set):
        Hop 1: link resolves hub_key (intermediate key)
        Hop 2: via.link resolves via.hub_key (final conformed key)
        via_{idx}.{via.hub_key} AS {fk_column}
    """
    lnk: str = f"lnk_{idx}"

    # --- Hop 1: primary link → intermediate hub_key ---
    if fk.effectivity_satellite:
        join_sql: str = (
            f"{fk.join_type} JOIN (\n"
            f"    SELECT lnk.{hub_hash_key}, lnk.{fk.hub_key}\n"
            f"    FROM {source_full}.{fk.link} lnk\n"
            f"    INNER JOIN {source_full}.{fk.effectivity_satellite} eff\n"
            f"        ON lnk.LinkHashKey = eff.LinkHashKey\n"
            f"        AND eff.IsActive = true\n"
            f"        AND eff.ETL_EndDate IS NULL\n"
            f") {lnk}\n"
            f"    ON hub.{hub_hash_key} = {lnk}.{hub_hash_key}"
        )
    elif fk.driving_key:
        # Latest relationship per primary hub key via ROW_NUMBER
        join_sql: str = (
            f"{fk.join_type} JOIN (\n"
            f"    SELECT {hub_hash_key}, {fk.hub_key},\n"
            f"           ROW_NUMBER() OVER (PARTITION BY {hub_hash_key} "
            f"ORDER BY ETL_LoadDate DESC) AS _rn\n"
            f"    FROM {source_full}.{fk.link}\n"
            f") {lnk}\n"
            f"    ON hub.{hub_hash_key} = {lnk}.{hub_hash_key}\n"
            f"    AND {lnk}._rn = 1"
        )
    else:
        # Plain link join
        join_sql: str = (
            f"{fk.join_type} JOIN {source_full}.{fk.link} {lnk}\n"
            f"    ON hub.{hub_hash_key} = {lnk}.{hub_hash_key}"
        )

    # --- Hop 2 (optional): same-as link → conformed hub_key ---
    if fk.via:
        via_alias: str = f"via_{idx}"
        if fk.via.effectivity_satellite:
            # Same-as link with effsat (Pattern 1, e.g., SF same-as link)
            join_sql += (
                f"\n{fk.via.join_type} JOIN (\n"
                f"    SELECT lnk2.{fk.hub_key}, lnk2.{fk.via.hub_key}\n"
                f"    FROM {source_full}.{fk.via.link} lnk2\n"
                f"    INNER JOIN {source_full}.{fk.via.effectivity_satellite} eff2\n"
                f"        ON lnk2.LinkHashKey = eff2.LinkHashKey\n"
                f"        AND eff2.IsActive = true\n"
                f"        AND eff2.ETL_EndDate IS NULL\n"
                f") {via_alias}\n"
                f"    ON {lnk}.{fk.hub_key} = {via_alias}.{fk.hub_key}"
            )
        else:
            # Plain same-as link (Pattern 3, e.g., NS same-as link)
            join_sql += (
                f"\n{fk.via.join_type} JOIN {source_full}.{fk.via.link} {via_alias}\n"
                f"    ON {lnk}.{fk.hub_key} = {via_alias}.{fk.hub_key}"
            )
        return join_sql, f"COALESCE({via_alias}.{fk.via.hub_key}, MD5('{_UNKNOWN_SENTINEL_ID}')) AS {fk.fk_column}"

    return join_sql, f"COALESCE({lnk}.{fk.hub_key}, MD5('{_UNKNOWN_SENTINEL_ID}')) AS {fk.fk_column}"


# ----------------------------------------------------------------------------
# Query builder
# ----------------------------------------------------------------------------


def _build_hub_query(
    spark: SparkSession,
    config: GoldConfig,
    table: GoldTableConfig,
    vault_meta: _VaultMeta,
) -> str:
    """Build the SELECT query for a hub-based gold table."""
    full_source: str = f"{config.target_catalog}.{config.source_schema}"

    hub_hash_key: str | None = vault_meta.hub_hash_keys.get(table.hub)
    if hub_hash_key is None:
        raise ValueError(
            f"Hub '{table.hub}' not found in vault metadata. Has sync been run?"
        )

    if not table.satellites:
        raise ValueError(
            f"Table '{table.table_name}' has no satellites configured."
        )

    primary_parent_key: str | None = vault_meta.sat_parent_keys.get(table.satellites[0].name)
    if primary_parent_key is None:
        raise ValueError(
            f"Primary satellite '{table.satellites[0].name}' not found in vault metadata."
        )

    select_parts: list[str] = []
    join_parts: list[str] = []

    # Key column
    select_parts.append(f"hub.{hub_hash_key} AS {table.key_column}")

    # Historical: auto-inject effective-date window columns
    if table.load_type == "historical":
        select_parts.extend([
            "sat0.ETL_LoadDate AS ETLEffectiveFrom",
            (
                f"LEAD(sat0.ETL_LoadDate) OVER "
                f"(PARTITION BY sat0.{primary_parent_key} ORDER BY sat0.ETL_LoadDate)"
                f" AS ETLEffectiveTo"
            ),
            "(sat0.ETL_EndDate IS NULL) AS IsCurrent",
        ])

    # Partition/tenant columns — always from primary satellite
    select_parts.extend(["sat0.ETL_SourceSystem", "sat0.ETL_Brand", "sat0.ETL_Region"])

    # Satellite columns + joins
    # Build an identity → SQL-alias lookup for chain join resolution.
    sat_alias_map: dict[str, str] = {}

    for idx, sat in enumerate(table.satellites):
        sat_alias: str = f"sat{idx}"
        sat_alias_map[sat.identity] = sat_alias   # keyed on alias or name

        # Vault metadata is keyed on physical table name (sat.name), not alias
        parent_key: str | None = vault_meta.sat_parent_keys.get(sat.name)
        if parent_key is None:
            raise ValueError(
                f"Satellite '{sat.name}' not found in vault metadata."
            )

        sat_full_path: str = f"{full_source}.{sat.name}"   # physical table — always sat.name
        select_parts.extend(
            _sat_col_exprs(spark, sat, sat_alias, parent_key, sat_full_path)
        )

        if idx == 0:
            # Primary satellite — always INNER JOIN to hub
            join_parts.append(
                _primary_sat_join(
                    sat.name, sat_alias, f"hub.{hub_hash_key}", parent_key,
                    table.load_type, config.brand, config.region, full_source
                )
            )
        elif sat.chain_join:
            # Chain-joined satellite — joins through another satellite
            parent_alias: str = sat_alias_map[sat.chain_join.parent_satellite]
            join_parts.append(
                _chain_sat_join(
                    sat.name, sat_alias, parent_alias,
                    sat.chain_join.left_key, sat.chain_join.right_key,
                    table.load_type, config.brand, config.region, full_source,
                    sat.chain_join.join_type,
                )
            )
        else:
            # Standard secondary satellite — LEFT JOIN to hub
            join_parts.append(
                _secondary_sat_join(
                    sat.name, sat_alias, f"hub.{hub_hash_key}", parent_key,
                    table.load_type, config.brand, config.region, full_source
                )
            )

    # FK joins
    for idx, fk in enumerate(table.foreign_keys):
        fk_join, fk_expr = _fk_join_and_expr(fk, hub_hash_key, full_source, idx)
        join_parts.append(fk_join)
        select_parts.append(fk_expr)

    select_str: str = ",\n    ".join(select_parts)
    joins_str: str = "\n".join(join_parts)
    where_clause: str = f"\nWHERE {table.filter}" if table.filter and table.filter != "1=1" else ""

    return (
        f"SELECT\n    {select_str}\n"
        f"FROM {full_source}.{table.hub} hub\n"
        f"{joins_str}"
        f"{where_clause}"
    )


def _build_link_query(
    spark: SparkSession,
    config: GoldConfig,
    table: GoldTableConfig,
    vault_meta: _VaultMeta,
) -> str:
    """Build the SELECT query for a link-based gold table.

    Anchors on the link table (LinkHashKey), INNER JOINs the primary
    satellite, LEFT JOINs any secondaries, and resolves hub hash keys
    directly from the link's own columns (no additional link joins needed).
    """
    full_source: str = f"{config.target_catalog}.{config.source_schema}"

    if not table.satellites:
        raise ValueError(
            f"Table '{table.table_name}' has no satellites configured."
        )

    primary_parent_key: str | None = vault_meta.sat_parent_keys.get(table.satellites[0].name)
    if primary_parent_key is None:
        raise ValueError(
            f"Primary satellite '{table.satellites[0].name}' not found in vault metadata."
        )

    select_parts: list[str] = []
    join_parts: list[str] = []

    #key column — LinkHashKey from the link table
    select_parts.append(f"lnk.LinkHashKey AS {table.key_column}")

    #historical: auto-inject effective-date window columns
    if table.load_type == "historical":
        select_parts.extend([
            "sat0.ETL_LoadDate AS ETLEffectiveFrom",
            (
                f"LEAD(sat0.ETL_LoadDate) OVER "
                f"(PARTITION BY sat0.{primary_parent_key} ORDER BY sat0.ETL_LoadDate)"
                f" AS ETLEffectiveTo"
            ),
            "(sat0.ETL_EndDate IS NULL) AS IsCurrent",
        ])

    #partition/tenant columns from primary satellite
    select_parts.extend(["sat0.ETL_SourceSystem", "sat0.ETL_Brand", "sat0.ETL_Region"])

    #satellite columns + joins
    anchor_key_expr = "lnk.LinkHashKey"
    sat_alias_map: dict[str, str] = {}

    for idx, sat in enumerate(table.satellites):
        sat_alias: str = f"sat{idx}"
        sat_alias_map[sat.identity] = sat_alias

        parent_key: str | None = vault_meta.sat_parent_keys.get(sat.name)
        if parent_key is None:
            raise ValueError(
                f"Satellite '{sat.name}' not found in vault metadata."
            )

        sat_full_path: str = f"{full_source}.{sat.name}"
        select_parts.extend(
            _sat_col_exprs(spark, sat, sat_alias, parent_key, sat_full_path)
        )

        if idx == 0:
            join_parts.append(
                _primary_sat_join(
                    sat.name, sat_alias, anchor_key_expr, parent_key,
                    table.load_type, config.brand, config.region, full_source,
                )
            )
        elif sat.chain_join:
            parent_alias: str = sat_alias_map[sat.chain_join.parent_satellite]
            join_parts.append(
                _chain_sat_join(
                    sat.name, sat_alias, parent_alias,
                    sat.chain_join.left_key, sat.chain_join.right_key,
                    table.load_type, config.brand, config.region, full_source,
                    sat.chain_join.join_type,
                )
            )
        else:
            join_parts.append(
                _secondary_sat_join(
                    sat.name, sat_alias, anchor_key_expr, parent_key,
                    table.load_type, config.brand, config.region, full_source,
                )
            )

    #FK resolution — hub hash keys read directly from the anchor link
    for fk in table.foreign_keys:
        if fk.link != table.link:
            raise ValueError(
                f"Table '{table.table_name}': foreign_key references link "
                f"'{fk.link}' but table is anchored on '{table.link}'. "
                f"Link-anchored tables only support FKs from the anchor link."
            )
        select_parts.append(
            f"COALESCE(lnk.{fk.hub_key}, MD5('{_UNKNOWN_SENTINEL_ID}')) AS {fk.fk_column}"
        )

    select_str: str = ",\n    ".join(select_parts)
    joins_str: str = "\n".join(join_parts)
    where_clause: str = f"\nWHERE {table.filter}" if table.filter and table.filter != "1=1" else ""

    return (
        f"SELECT\n    {select_str}\n"
        f"FROM {full_source}.{table.link} lnk\n"
        f"{joins_str}"
        f"{where_clause}"
    )


# ----------------------------------------------------------------------------
# Write functions
# ----------------------------------------------------------------------------


def _write_full_refresh(
    spark: SparkSession,
    df,
    config: GoldConfig,
    table_name: str,
) -> None:
    """Dynamic partition overwrite — atomically replaces only this tenant's partition.

    Uses DataFrameWriterV2 (writeTo) to avoid the CreateDeltaTableCommand code
    path, which performs an alterTableDryRun that fails when the table has
    governed-tagged columns not present in the incoming DataFrame.

    Falls back to saveAsTable on first run (table does not yet exist) since
    writeTo requires a pre-existing table.
    """
    full_target: str = f"{config.target_catalog}.{config.target_schema}.{table_name}"

    if not spark.catalog.tableExists(full_target):
        # First-run: table doesn't exist yet — safe to use saveAsTable
        (
            df.write
            .format("delta")
            .mode("overwrite")
            .option("mergeSchema", "true")
            .partitionBy(*PARTITION_COLUMNS)
            .saveAsTable(full_target)
        )
        spark.sql(
            f"ALTER TABLE {full_target} "
            "SET TBLPROPERTIES ('delta.columnMapping.mode' = 'name')"
        )
        print(f"  [{table_name}] Created {full_target} (initial write)")
        return

    # Existing table: use writeTo to bypass alterTableDryRun which rejects
    # dropping governed-tagged columns not present in this tenant's DataFrame.
    (
        df.writeTo(full_target)
        .option("mergeSchema", "true")
        .overwritePartitions()
    )
    print(f"  [{table_name}] Written to {full_target} (partition overwrite)")


def _merge_incremental(
    spark: SparkSession,
    df,
    config: GoldConfig,
    table: GoldTableConfig,
) -> None:
    """Write incremental records via partition overwrite.

    TODO: Replace with proper MERGE on key_column once if incremental merges are desired in the future
    """
    print(
        f"  [{table.table_name}] Incremental mode — falling back to "
        "partition overwrite (MERGE not yet implemented)"
    )
    _write_full_refresh(spark, df, config, table_name=table.table_name)


# ----------------------------------------------------------------------------
# Per-table loader
# ----------------------------------------------------------------------------


def load_table(
    spark: SparkSession,
    config: GoldConfig,
    table: GoldTableConfig,
    vault_meta: _VaultMeta,
) -> dict[str, str]:
    """Build and execute the gold query for one table."""
    print(
        f"Loading gold table: {table.table_name} "
        f"(type={table.table_type}, load_type={table.load_type}, mode={table.load_mode})"
    )

    if table.table_type == "hierarchy_bridge":
        raise NotImplementedError(
            f"hierarchy_bridge not yet implemented for '{table.table_name}'."
        )
    if table.link and not table.hub:
        query: str = _build_link_query(spark, config, table, vault_meta)
    else:
        query: str = _build_hub_query(spark, config, table, vault_meta)
    print(f"  [{table.table_name}] Query built — executing...")
    df = spark.sql(query)

    # Backfill columns contributed by other tenants with unknown sentinels
    df = _align_missing_columns(df, spark, config, table.table_name)

    if table.table_type == "dim":
        df = _append_sentinel_rows(spark, df, config, table)

    if table.load_mode == "full_refresh":
        _write_full_refresh(spark, df, config, table_name=table.table_name)
    elif table.load_mode == "incremental":
        _merge_incremental(spark, df, config, table)
    else:
        raise ValueError(
            f"Unknown load_mode '{table.load_mode}' on table '{table.table_name}'"
        )

    return {"table": table.table_name, "status": "ok"}


# ----------------------------------------------------------------------------
# Entry points
# ----------------------------------------------------------------------------


def _validate_config_paths(
    config: GoldConfig,
    vault_config_path: str | None,
    bsat_config_path: str | list[str] | None,
    table_filter: list[str] | None = None,
) -> None:
    """Validate that required config paths are provided based on gold config content.

    Scans active tables (respecting table_filter) and raises ValueError with
    specific details when a required path is missing.
    """
    vault_reasons: list[str] = []
    bsat_reasons: list[str] = []

    for table in config.tables:
        if not table.is_active:
            continue
        if table_filter and table.table_name not in table_filter:
            continue
        # Hub-based tables need vault config OR bsat config for hash key resolution.
        # Business hubs (bhub_*) are resolved from bsat config; raw vault hubs from vault config.
        if table.hub and not vault_config_path and not bsat_config_path:
            vault_reasons.append(f"hub '{table.hub}' (table '{table.table_name}')")
        for sat in table.satellites:
            if sat.satellite_type == "vault" and not vault_config_path:
                vault_reasons.append(
                    f"vault satellite '{sat.name}' (table '{table.table_name}')"
                )
            elif sat.satellite_type == "business" and not bsat_config_path:
                bsat_reasons.append(
                    f"business satellite '{sat.name}' (table '{table.table_name}')"
                )

    if vault_reasons:
        detail: str = ", ".join(vault_reasons[:5])
        suffix: str = f" ... and {len(vault_reasons) - 5} more" if len(vault_reasons) > 5 else ""
        raise ValueError(
            f"vault_config_path is required for this gold config. "
            f"Needed to resolve: {detail}{suffix}"
        )
    if bsat_reasons:
        detail: str = ", ".join(bsat_reasons[:5])
        suffix: str = f" ... and {len(bsat_reasons) - 5} more" if len(bsat_reasons) > 5 else ""
        raise ValueError(
            f"bsat_config_path is required for this gold config. "
            f"Needed to resolve: {detail}{suffix}"
        )


def run(
    spark: SparkSession,
    config: GoldConfig,
    vault_config_path: str | None = None,
    bsat_config_path: str | list[str] | None = None,
    table_filter: list[str] | None = None,
) -> dict[str, object]:
    """Run the gold loader for all active tables in config.

    Loads vault metadata once, then iterates over config.tables in order,
    skipping inactive tables and any not in table_filter (if provided).

    Validates that vault_config_path and bsat_config_path are provided when
    the gold config references vault or business satellites respectively.

    Args:
        spark: Active SparkSession.
        config: GoldConfig for this source_system / brand / region tenant.
        vault_config_path: Path to vault YAML config. Required when tables
            reference hubs or vault satellites.
        bsat_config_path: Path(s) to business satellite YAML config(s).
            Accepts a single string or a list of strings. Required when
            tables reference business satellites or business hubs.
        table_filter: Optional list of table_names to load; None = load all.

    Returns:
        Dict with per-table results and a summary.
    """
    _validate_config_paths(config, vault_config_path, bsat_config_path, table_filter)

    print(
        f"Gold loader starting: {config.source_system} / {config.brand} / {config.region} "
        f"— {len(config.tables)} tables configured"
    )

    vault_meta: _VaultMeta = _load_vault_meta(
        spark, config.target_catalog,
        vault_config_path=vault_config_path,
        bsat_config_path=bsat_config_path,
    )

    results: dict = {}
    errors: dict = {}

    for table in config.tables:
        if not table.is_active:
            continue
        if table_filter and table.table_name not in table_filter:
            continue
        try:
            result: dict[str, str] = load_table(spark, config, table, vault_meta)
            results[table.table_name] = result
        except NotImplementedError as exc:
            print(f"  [{table.table_name}] SKIPPED (not implemented): {exc}")
            results[table.table_name] = {
                "table": table.table_name,
                "status": "skipped",
                "reason": str(exc),
            }
        except Exception as exc:
            print(f"  [{table.table_name}] ERROR: {exc}")
            errors[table.table_name] = str(exc)
            results[table.table_name] = {
                "table": table.table_name,
                "status": "error",
                "error": str(exc),
            }

    summary: dict[str, int] = {
        "total": len(results),
        "ok": sum(1 for r in results.values() if r.get("status") == "ok"),
        "skipped": sum(1 for r in results.values() if r.get("status") == "skipped"),
        "errors": sum(1 for r in results.values() if r.get("status") == "error"),
    }
    print(
        f"Gold loader complete: {summary['ok']} ok, "
        f"{summary['skipped']} skipped, {summary['errors']} errors"
    )

    if errors:
        raise RuntimeError(
            f"Gold loader failed for {len(errors)} table(s): {list(errors.keys())}. "
            "Check logs above for details."
        )

    return {"tables": results, "summary": summary}

