# Silver Business Satellite Configuration - Salesforce curated business satellites
# This file defines metadata-driven business satellites sourced from vault satellites.
# Run the business satellite metadata sync to push changes into the metadata tables.
#
# is_active can be set at two levels:
#   satellite level - set false to skip the entire bsat during sync and loading
#   attribute level - set false to exclude a single column transformation from the load
#
# NOTE: ETL_SourceSystem, ETL_Brand, ETL_Region are automatically added to ALL
# business satellite tables by the framework. They are passed through from the
# source silver satellite and do not need to be listed in attributes.
# brand and region filter the source satellite rows to the target tenant.


source_system: salesforce
record_source: salesforce_business
target_catalog: bbdatawarehouse_dev
source_schema: silver
target_schema: silver
brand: Bluebeam
region: US

satellites:
# Source: restricted satellite - Name and billing/shipping address are PII columns
# stored in salesforce_sat_account_restricted_bluebeam_us, not the general sat.
- table_name: salesforce_bsat_accounts_restricted_bluebeam_us
  source_table: salesforce_sat_accounts_restricted_bluebeam_us
  parent_key_column: HubAccountHashKey
  filter: "1=1"
  is_active: true
  attributes:
  - target_column: AccountNameNormalized
    source_column: AccountNameNormalized
    description: Normalized account name for search and matching.
    is_active: true
    transforms:
    - name: trim
    - name: normalize_company_name
    - name: default_values

  - target_column: AccountBillingStreetNormalized
    source_column: AccountBillingStreetNormalized
    description: Standardized billing street address.
    is_active: true
    transforms:
    - name: trim
    - name: normalize_street_address
    - name: default_values

  - target_column: AccountBillingCityNormalized
    source_column: AccountBillingCityNormalized
    description: Standardized billing city.
    is_active: true
    transforms:
    - name: trim
    - name: upper
    - name: default_values

  - target_column: AccountBillingStateNormalized
    source_column: AccountBillingStateNormalized
    description: Standardized billing state or province.
    is_active: true
    transforms:
    - name: trim
    - name: normalize_state_province
      args:
        country_column: AccountBillingCountryNormalized
    - name: default_values

  - target_column: AccountBillingPostalCodeNormalized
    source_column: AccountBillingPostalCodeNormalized
    description: Standardized billing postal code.
    is_active: true
    transforms:
    - name: trim
    - name: normalize_postal
    - name: default_values

  - target_column: AccountBillingCountryNormalized
    source_column: AccountBillingCountryNormalized
    description: Standardized billing country.
    is_active: true
    transforms:
    - name: trim
    - name: upper
    - name: default_values

  - target_column: AccountShippingStreetNormalized
    source_column: AccountShippingStreetNormalized
    description: Standardized shipping street address.
    is_active: true
    transforms:
    - name: trim
    - name: normalize_street_address
    - name: default_values

  - target_column: AccountShippingCityNormalized
    source_column: AccountShippingCityNormalized
    description: Standardized shipping city.
    is_active: true
    transforms:
    - name: trim
    - name: upper
    - name: default_values

  - target_column: AccountShippingStateNormalized
    source_column: AccountShippingStateNormalized
    description: Standardized shipping state or province.
    is_active: true
    transforms:
    - name: trim
    - name: normalize_state_province
      args:
        country_column: AccountShippingCountryNormalized
    - name: default_values

  - target_column: AccountShippingPostalCodeNormalized
    source_column: AccountShippingPostalCodeNormalized
    description: Standardized shipping postal code.
    is_active: true
    transforms:
    - name: trim
    - name: normalize_postal
    - name: default_values

  - target_column: AccountShippingCountryNormalized
    source_column: AccountShippingCountryNormalized
    description: Standardized shipping country.
    is_active: true
    transforms:
    - name: trim
    - name: upper
    - name: default_values

  - target_column: AccountSearchDisplay
    description: Search-friendly display string.
    is_active: true
    transforms:
    - name: concat_ws
      args:
        separator: " | "
        columns: [AccountNameNormalized, AccountBillingCityNormalized, AccountBillingStateNormalized, AccountBillingCountryNormalized]
    - name: trim
    - name: default_values

