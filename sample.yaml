# =============================================================================
# Chargebee Gold Configuration — SiteDocs
# =============================================================================
# Star schema per "SiteDocs Star Schema Object Map": dim_CB_Customer, dim_CB_Plan,
# fact_CB_Subscription, fact_CB_Invoice. Standalone - no cross-system link to
# Salesforce in the vault framework. The SF<->CB join happens later, above gold,
# using the plain attribute columns carried through (CustomerSalesforceAccountId
# etc.) - not a hash join.
#
# Money fields (mrr, plan price, invoice total/paid/due) are converted from
# integer cents to decimal dollars in the bsat layer (cents_to_dollars
# transform) - gold only ever reads the *Usd columns, never raw cents.
#
# Every column is read from a bsat, so nulls are already defaulted there.
# Dates are epoch seconds in the vault. Dims read timestamps from the bsat
# (epoch_to_timestamp); facts read *DateKey (joins dim_dates) and CurrencyKey
# (joins dim_currencies) from the bsat, never raw epoch or currency codes.

source_system: chargebee
brand: SiteDocs
region: US
target_catalog: bbdatawarehouse_dev
source_schema: silver
target_schema: gold

tables:
  - table_name: chargebee_dim_customers
    table_type: dim
    load_type: active
    load_mode: full_refresh
    hub: chargebee_hub_customers
    key_column: CustomerKey
    satellites:
      - name: chargebee_bsat_customers_sitedocs_us
        satellite_type: business
        columns:
          - source: CustomerAutoCollection
            target: AutoCollection
          - source: CustomerDeleted
            target: Deleted
          - source: CustomerSalesforceAccountId
            target: SalesforceAccountId
          - source: CustomerMrrUsd
            target: MrrUsd
          - source: CustomerCreatedAt
            target: CreatedAt

  #PII columns from the restricted bsat - joins to chargebee_dim_customers on CustomerKey
  - table_name: chargebee_dim_customers_restricted
    table_type: dim
    load_type: active
    load_mode: full_refresh
    hub: chargebee_hub_customers
    key_column: CustomerKey
    satellites:
      - name: chargebee_bsat_customers_restricted_sitedocs_us
        satellite_type: business
        columns:
          - source: CustomerCompany
            target: Company
          - source: CustomerEmail
            target: Email

  - table_name: chargebee_dim_plans
    table_type: dim
    load_type: active
    load_mode: full_refresh
    hub: chargebee_hub_plans
    key_column: PlanKey
    satellites:
      - name: chargebee_bsat_plans_sitedocs_us
        satellite_type: business
        columns:
          - source: PlanName
            target: Name
          - source: PlanPeriod
            target: Period
          - source: PlanPeriodUnit
            target: PeriodUnit
          - source: PlanCurrencyCode
            target: CurrencyCode
          - source: PlanStatus
            target: Status
          - source: PlanPriceUsd
            target: PriceUsd

  - table_name: chargebee_fact_subscriptions
    table_type: fact
    load_type: active
    load_mode: full_refresh
    hub: chargebee_hub_subscriptions
    key_column: SubscriptionKey
    satellites:
      - name: chargebee_bsat_subscriptions_sitedocs_us
        satellite_type: business
        columns:
          - source: SubscriptionStatus
            target: Status
          - source: SubscriptionBillingPeriod
            target: BillingPeriod
          - source: SubscriptionBillingPeriodUnit
            target: BillingPeriodUnit
          - source: SubscriptionDeleted
            target: Deleted
          - source: SubscriptionMrrUsd
            target: MrrUsd
          - source: SubscriptionPlanAmountUsd
            target: PlanAmountUsd
          - source: SubscriptionActivatedDateKey
            target: ActivatedDateKey
          - source: SubscriptionCurrentTermStartDateKey
            target: CurrentTermStartDateKey
          - source: SubscriptionCurrentTermEndDateKey
            target: CurrentTermEndDateKey
          - source: SubscriptionNextBillingDateKey
            target: NextBillingDateKey
          - source: SubscriptionCancelledDateKey
            target: CancelledDateKey
          - source: SubscriptionCurrencyKey
            target: CurrencyKey
          - source: ETL_HashDiff
      #address key from the restricted bsat - carried here with 'Restricted' in the column
      #name so the column-level masking policy applies to it
      - name: chargebee_bsat_subscriptions_restricted_sitedocs_us
        satellite_type: business
        columns:
          - source: SubscriptionShippingAddressKey
            target: ShippingAddressRestrictedKey
    foreign_keys:
      - link: chargebee_link_subscription_customer
        hub_key: HubCustomerHashKey
        fk_column: CustomerKey
        join_type: LEFT
      - link: chargebee_link_subscription_plan
        hub_key: HubPlanHashKey
        fk_column: PlanKey
        effectivity_satellite: chargebee_effsat_chargebee_link_subscription_plan_sitedocs
        join_type: LEFT

  - table_name: chargebee_fact_invoices
    table_type: fact
    load_type: active
    load_mode: full_refresh
    hub: chargebee_hub_invoices
    key_column: InvoiceKey
    satellites:
      - name: chargebee_bsat_invoices_sitedocs_us
        satellite_type: business
        columns:
          - source: InvoiceStatus
            target: Status
          - source: InvoiceRecurring
            target: Recurring
          - source: InvoiceDeleted
            target: Deleted
          - source: InvoiceTotalUsd
            target: TotalUsd
          - source: InvoiceAmountPaidUsd
            target: AmountPaidUsd
          - source: InvoiceAmountDueUsd
            target: AmountDueUsd
          - source: InvoiceDateKey
            target: InvoiceDateKey
          - source: InvoiceDueDateKey
            target: DueDateKey
          - source: InvoiceCurrencyKey
            target: CurrencyKey
          - source: ETL_HashDiff
      #address keys from the restricted bsat - carried here with 'Restricted' in the column
      #names so the column-level masking policy applies to them
      - name: chargebee_bsat_invoices_restricted_sitedocs_us
        satellite_type: business
        columns:
          - source: InvoiceBillingAddressKey
            target: BillingAddressRestrictedKey
          - source: InvoiceShippingAddressKey
            target: ShippingAddressRestrictedKey
    foreign_keys:
      - link: chargebee_link_invoice_customer
        hub_key: HubCustomerHashKey
        fk_column: CustomerKey
        join_type: LEFT
      - link: chargebee_link_invoice_subscription
        hub_key: HubSubscriptionHashKey
        fk_column: SubscriptionKey
        join_type: LEFT

