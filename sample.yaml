# Chargebee Bronze Extract Job
# Three-phase: generate inputs -> fetch raw -> normalize per object -> purge staging
resources:
  jobs:
    chargebee_bronze_extract:
      name: "chargebee-bronze-extract-${bundle.target}"
      max_concurrent_runs: 1
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: extract_load_mode
          default: incremental
        - name: config_path
          default: ${workspace.file_path}/Chargebee/bronze/config/extract_config_chargebee.yaml
      environments:
        - environment_key: run_env
          spec:
            environment_version: "5"
            dependencies:
              - -r "${workspace.file_path}/Environments/requirements.txt"
              - ${workspace.file_path}/Libraries/connectors
              - ${workspace.file_path}/Libraries/framework
      tasks:
        # Phase 1: generate the list of objects to extract
        - task_key: generate_inputs
          environment_key: run_env
          notebook_task:
            notebook_path: ../../../Shared/notebooks/framework/generate_bronze_inputs.py
            base_parameters:
              config_path: "{{job.parameters.config_path}}"

        # Phase 2: fetch each endpoint, write raw JSON to staging
        - task_key: fetch_raw
          depends_on:
            - task_key: generate_inputs
          environment_key: run_env
          notebook_task:
            notebook_path: ../notebooks/fetch_chargebee_raw.py
            base_parameters:
              config_path: "{{job.parameters.config_path}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              extract_load_mode: "{{job.parameters.extract_load_mode}}"

        # Phase 3: normalize each object from staging into target bronze tables
        - task_key: extract_objects
          depends_on:
            - task_key: fetch_raw
          for_each_task:
            inputs: "{{tasks.generate_inputs.values.object_list}}"
            concurrency: 4
            task:
              task_key: run_extract
              environment_key: run_env
              notebook_task:
                notebook_path: ../../../Shared/notebooks/framework/source_to_bronze_sql.py
                base_parameters:
                  config_path: "{{job.parameters.config_path}}"
                  source_object: "{{input.source_object}}"
                  catalog_name: "{{job.parameters.catalog_name}}"
                  load_mode: "{{job.parameters.extract_load_mode}}"

        # Phase 3b: flatten billing/shipping address JSON into bronze.chargebee_address_sitedocs_us
        - task_key: address_extract
          depends_on:
            - task_key: extract_objects
          environment_key: run_env
          notebook_task:
            notebook_path: ../notebooks/chargebee_address_extract.py
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              load_mode: "{{job.parameters.extract_load_mode}}"

        # Phase 4: enforce retention on raw staging tables
        - task_key: purge_staging
          depends_on:
            - task_key: extract_objects
          run_if: ALL_DONE
          environment_key: run_env
          notebook_task:
            notebook_path: ../notebooks/purge_chargebee_staging.py
            base_parameters:
              config_path: "{{job.parameters.config_path}}"
              catalog_name: "{{job.parameters.catalog_name}}"
