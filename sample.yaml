#silver transform configuration - Chargebee Data Vault 2.0
#hubs, links, and satellites for the raw vault.
#run the sync_vault_metadata notebook to push changes into the metadata tables.
#NOTE: ETL_SourceSystem, ETL_Brand, ETL_Region are automatically added to ALL
#vault entities by the framework. They do not need to be listed here.
#
#SCOPE: 6 objects confirmed with the team - customers, plans, addons, coupons,
#invoices, subscriptions. All links here are Chargebee-internal. The SF<->CB
#relationship is NOT modelled in the vault (the framework cannot express a
#cross-system link); it is resolved above gold on the business key.
#
#All Chargebee timestamps are bigint epoch seconds and all money is integer
#cents. Both are carried raw here and converted in the business satellite layer.

source_system: chargebee
record_source: chargebee_sitedocs
brand: SiteDocs
region: US
target_catalog: bbdatawarehouse_dev
bronze_schema: bronze
silver_schema: silver

#--- hubs ---

hubs:
  - table_name: chargebee_hub_customers
    source_table: chargebee_customers_sitedocs_us
    business_key_column: id
    hash_key_name: HubCustomerHashKey
    bk_column_name: CustomerBk
    is_active: true

  - table_name: chargebee_hub_subscriptions
    source_table: chargebee_subscriptions_sitedocs_us
    business_key_column: id
    hash_key_name: HubSubscriptionHashKey
    bk_column_name: SubscriptionBk
    is_active: true

  - table_name: chargebee_hub_plans
    source_table: chargebee_plans_sitedocs_us
    business_key_column: id
    hash_key_name: HubPlanHashKey
    bk_column_name: PlanBk
    is_active: true

  - table_name: chargebee_hub_invoices
    source_table: chargebee_invoices_sitedocs_us
    business_key_column: id
    hash_key_name: HubInvoiceHashKey
    bk_column_name: InvoiceBk
    is_active: true

  - table_name: chargebee_hub_addons
    source_table: chargebee_addons_sitedocs_us
    business_key_column: id
    hash_key_name: HubAddonHashKey
    bk_column_name: AddonBk
    is_active: true

  - table_name: chargebee_hub_coupons
    source_table: chargebee_coupons_sitedocs_us
    business_key_column: id
    hash_key_name: HubCouponHashKey
    bk_column_name: CouponBk
    is_active: true

#--- links ---

links:
  #a subscription belongs to one customer for its lifetime - immutable
  - table_name: chargebee_link_subscription_customer
    source_table: chargebee_subscriptions_sitedocs_us
    hash_columns:
      - id
      - customer_id
    hub_references:
      - column_name: HubSubscriptionHashKey
        source_column: id
      - column_name: HubCustomerHashKey
        source_column: customer_id
    extra_bk: null
    filter: "src.customer_id IS NOT NULL AND src.customer_id != ''"
    relationship_pattern: 3
    is_active: true

  #plan CHANGES on upgrade/downgrade - this is what drives MRR movement.
  #pattern 1 so the effectivity satellite tracks the plan history.
  - table_name: chargebee_link_subscription_plan
    source_table: chargebee_subscriptions_sitedocs_us
    hash_columns:
      - id
      - plan_id
    hub_references:
      - column_name: HubSubscriptionHashKey
        source_column: id
      - column_name: HubPlanHashKey
        source_column: plan_id
    extra_bk: null
    filter: "src.plan_id IS NOT NULL AND src.plan_id != ''"
    relationship_pattern: 1
    driving_key_column: HubSubscriptionHashKey
    is_active: true

  - table_name: chargebee_link_invoice_subscription
    source_table: chargebee_invoices_sitedocs_us
    hash_columns:
      - id
      - subscription_id
    hub_references:
      - column_name: HubInvoiceHashKey
        source_column: id
      - column_name: HubSubscriptionHashKey
        source_column: subscription_id
    extra_bk: null
    filter: "src.subscription_id IS NOT NULL AND src.subscription_id != ''"
    relationship_pattern: 3
    is_active: true

  - table_name: chargebee_link_invoice_customer
    source_table: chargebee_invoices_sitedocs_us
    hash_columns:
      - id
      - customer_id
    hub_references:
      - column_name: HubInvoiceHashKey
        source_column: id
      - column_name: HubCustomerHashKey
        source_column: customer_id
    extra_bk: null
    filter: "src.customer_id IS NOT NULL AND src.customer_id != ''"
    relationship_pattern: 3
    is_active: true

