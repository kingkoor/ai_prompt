# Gold Layer Configuration - Skilljar (Bluebeam US)
# See README.md in this directory for documentation on load types, satellite types, restricted table rules, foreign key resolution strategies, and bridge tables.
# Run sync_gold_metadata_runner.py to push changes into the metadata tables.
#
# DESIGN RULES:
# V1
#   1. Column names will keep entity specific prefix as is with no aliasing.
#   2. Student PII is exposed only through skilljar_dim_students_restricted.
#   3. If a column later exists in both Vault and Business Satellites, source it from the Business Satellite.
#   4. This first pass includes directly supported Hub/Satellite/Link mappings.
#   5. Fabric specific derived measures, date keys, and calculated flags are deferred for validation.
# V2
#   1. Measure placement: numeric measures (counts, scores, durations) moved to fact tables only;

