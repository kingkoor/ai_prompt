SELECT count(*)                                                AS total,
       count_if(OppDetailARROverride IS NULL)                  AS override_null,
       count_if(OppDetailARRTermDays IS NULL)                  AS termdays_null,
       count_if(OppDetailARRInUSDNEMRates IS NULL)             AS usd_nem_null,
       count_if(OppDetailARRTotalIncomingARRInUSD IS NULL)     AS total_incoming_null,
       count_if(OppDetailARRCurrentMinusIncomingInUSD IS NULL) AS current_minus_null,
       count_if(OppDetailARROverride = 0)                      AS override_zero,
       count_if(OppDetailARRTermDays = 0)                      AS termdays_zero
FROM bbdatawarehouse_dev.gold.salesforce_fact_opp_details
WHERE ETL_Brand = 'SiteDocs';


SELECT count(*)                                                  AS total,
       count_if(OpportunityLineItemUnitPrice IS NULL)            AS unitprice_null,
       count_if(OpportunityLineItemTotalPrice IS NULL)           AS totalprice_null,
       count_if(OpportunityLineItemListPrice IS NULL)            AS listprice_null,
       count_if(OpportunityLineItemTotalPriceInUSDNEM2025 IS NULL) AS usd_nem_null,
       count_if(OpportunityLineItemUnitPrice = 0)                AS unitprice_zero
FROM bbdatawarehouse_dev.gold.salesforce_fact_opportunity_line_items
WHERE ETL_Brand = 'SiteDocs';
