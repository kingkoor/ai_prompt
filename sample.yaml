"""Generic business satellite loader for YAML-defined transformations.

Required tenant columns (ETL_SourceSystem, ETL_Brand, ETL_Region) are
automatically injected into all business satellite tables. If a source
satellite is missing any of them, the loader raises an error before attempting
INSERT. Source satellites are filtered by config.source_system, config.brand,
and config.region so that each loader run processes only the target tenant's data.
"""

from __future__ import annotations

from typing import Optional

import pyspark.sql.functions as f
from pyspark.sql import DataFrame, SparkSession
from pyspark.sql.window import Window

from datavault_util.hash_utils import hash_diff
from datavault_util.schema_utils import get_table_column_types
from datavault_util.sentinel import SENTINEL_ID_BY_LABEL

from business_satellite_metadata.config import (
    REQUIRED_TENANT_COLUMNS,
    BusinessAttributeConfig,
    BusinessHubConfig,
    BusinessHubSourceConfig,
    BusinessLinkConfig,
    BusinessSatelliteConfig,
    BusinessSatelliteEntityConfig,
    JoinedSatelliteConfig,
    load_business_satellite_config,
)
from business_satellite_metadata.transformations import get_transform

_NOT_AVAILABLE_SENTINEL_ID: str = SENTINEL_ID_BY_LABEL["Not Available"]


# ----------------------------------------------------------------------------
# Helpers
# ----------------------------------------------------------------------------

def _validate_source_columns(spark: SparkSession, source_table: str, entity_name: str) -> None:
    """Verify that the source silver satellite contains all required tenant columns.

    Raises:
        ValueError: If any of REQUIRED_TENANT_COLUMNS are missing from the table.
    """
    try:
        existing_cols: set = {field.name for field in spark.table(source_table).schema.fields}
    except Exception as e:
        raise ValueError(
            f"Cannot read schema of source table '{source_table}' "
            f"(referenced by {entity_name}): {e}"
        ) from e

    missing: list[str] = [c for c in REQUIRED_TENANT_COLUMNS if c not in existing_cols]
    if missing:
        raise ValueError(
            f"Source table '{source_table}' is missing required tenant columns: "
            f"{missing}. All source satellites must include {REQUIRED_TENANT_COLUMNS}."
        )


def _tenant_filter(df: DataFrame, config: BusinessSatelliteConfig) -> DataFrame:
    """Filter a DataFrame to the configured source system, brand, and region.

    Mirrors the vault_loaders pattern — all three tenant columns are applied so
    that records from different source systems or brand/region combinations
    cannot cross-contaminate a single business satellite run.
    """
    return df.filter(
        (f.col("ETL_SourceSystem") == f.lit(config.source_system))
        & (f.col("ETL_Brand") == f.lit(config.brand))
        & (f.col("ETL_Region") == f.lit(config.region))
    )


def _tenant_filter_source(df: DataFrame, source_hub: BusinessHubSourceConfig) -> DataFrame:
    """Filter a DataFrame to a business hub source_hub's tenant values.

    Business hub configs are cross-system (top-level source_system='conformed'),
    so each source_hub carries its own ETL_SourceSystem / ETL_Brand / ETL_Region
    for filtering raw vault hubs/satellites and for same-as link / effsat tenant
    columns.
    """
    return df.filter(
        (f.col("ETL_SourceSystem") == f.lit(source_hub.source_system))
        & (f.col("ETL_Brand") == f.lit(source_hub.brand))
        & (f.col("ETL_Region") == f.lit(source_hub.region))
    )


def _get_hash_key_column(df: DataFrame, entity_name: str) -> str:
    """Return the single hash key column on a hub table.

    Hubs are expected to have exactly one hash key column ending in 'HashKey'.
    Raises ValueError if none or multiple are found.
    """
    hash_key_cols: list = [field.name for field in df.schema.fields if field.name.endswith("HashKey")]
    if len(hash_key_cols) != 1:
        raise ValueError(
            f"Entity '{entity_name}' must have exactly one hash key column ending in 'HashKey', "
            f"found {hash_key_cols}"
        )
    return hash_key_cols[0]


# ----------------------------------------------------------------------------
# Joined Satellite Helpers
# ----------------------------------------------------------------------------

def _resolve_column_ref(col_name: str) -> str:
    """Resolve a column reference that may use dotted notation for joined satellites.

    ``currency.CurrencySymbol`` -> ``__js_currency__CurrencySymbol``
    ``TransactionDate`` -> ``TransactionDate`` (unchanged)
    """
    if "." in col_name:
        alias, column = col_name.split(".", 1)
        return f"__js_{alias}__{column}"
    return col_name


def _build_enrichment_df(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    satellite: BusinessSatelliteEntityConfig,
) -> Optional[DataFrame]:
    """Build an enrichment DataFrame by joining secondary satellites through links.

    Returns ``None`` if no ``joined_satellites`` are configured. Otherwise returns
    a DataFrame keyed on ``parent_key_column`` with all secondary satellite business
    columns renamed to ``__js_{alias}__{column}`` to avoid collisions with the
    primary source satellite.
    """
    if not satellite.joined_satellites:
        return None

    enrichment_df: Optional[DataFrame] = None

    for js in satellite.joined_satellites:
        link_schema: str = config.target_schema if js.link.startswith("link_sameas_") else config.source_schema
        link_table: str = f"{config.target_catalog}.{link_schema}.{js.link}"
        sat_table: str = f"{config.target_catalog}.{config.source_schema}.{js.satellite}"

        # Read link: optionally filter through an effectivity satellite first
        link_df = spark.table(link_table)
        if js.effectivity_satellite:
            effsat_schema: str = config.target_schema if js.effectivity_satellite.startswith("link_sameas_") or "link_sameas_" in js.effectivity_satellite else config.source_schema
            effsat_table: str = f"{config.target_catalog}.{effsat_schema}.{js.effectivity_satellite}"
            effsat_df = (
                spark.table(effsat_table)
                .filter((f.col("IsActive") == f.lit(True)) & f.col("ETL_EndDate").isNull())
                .select("LinkHashKey")
            )
            link_df = link_df.join(effsat_df, on="LinkHashKey", how="inner")

        link_df = link_df.select(satellite.parent_key_column, js.hub_key).distinct()

        # Read secondary satellite: current records only.
        # For hub-based sources (conformed configs), skip tenant filter on joined
        # satellites — the link join already constrains source system, and the
        # config's source_system ("conformed") won't match the raw satellite's.
        sec_df = spark.table(sat_table).filter(f.col("ETL_EndDate").isNull())
        if not satellite.is_hub_source:
            sec_df = _tenant_filter(sec_df, config)

        # Identify business columns (exclude system/ETL columns and the hub key)
        system_cols: set[str] = {
            js.hub_key.lower(), "etl_loaddate", "etl_enddate", "etl_hashdiff",
            "etl_recordsource", "etl_recordstatus", "etl_sourcesystem",
            "etl_brand", "etl_region",
        }
        sec_business_cols: list = [
            field.name for field in sec_df.schema.fields
            if field.name.lower() not in system_cols
        ]

        # Rename secondary columns to avoid collisions
        for col_name in sec_business_cols:
            sec_df = sec_df.withColumnRenamed(col_name, f"__js_{js.alias}__{col_name}")

        renamed_cols: list[str] = [f"__js_{js.alias}__{c}" for c in sec_business_cols]

        # Join link to secondary on hub_key, keep parent_key + renamed business cols
        joined = link_df.join(sec_df, on=js.hub_key, how="inner")

        # For hub sources, dedup M:1 fan-out: keep one satellite row per bhub
        # parent key.  Column ordering is driven by js.dedup_order_by (each
        # column sorted DESC); ETL_LoadDate DESC is always appended as a
        # tiebreaker.  Column names in the YAML are source-satellite names
        # (before the __js_ prefix); the prefix is applied here automatically.
        if satellite.is_hub_source and js.dedup_order_by:
            order_cols: list = [
                f.col(f"__js_{js.alias}__{col}").desc() for col in js.dedup_order_by
            ]
            order_cols.append(f.col("ETL_LoadDate").desc())
            w = Window.partitionBy(satellite.parent_key_column).orderBy(*order_cols)
            joined = joined.withColumn("__rn", f.row_number().over(w))
            joined = joined.filter(f.col("__rn") == 1).drop("__rn")

        joined = joined.select(satellite.parent_key_column, *renamed_cols).distinct()

        if enrichment_df is None:
            enrichment_df = joined
        else:
            # For hub-based sources (conformed), different joined satellites may
            # cover disjoint sets of parent keys (SF-only vs NS-only). Use FULL
            # OUTER JOIN to preserve all populations. For regular bsats all joined
            # satellites share the same parent key space, so LEFT is sufficient.
            combine_how = "full" if satellite.is_hub_source else "left"
            enrichment_df = enrichment_df.join(
                joined, on=satellite.parent_key_column, how=combine_how
            )

    return enrichment_df


def _resolve_source_type(
    source_col: str,
    primary_types: dict[str, str],
    joined_sat_types: dict[str, dict[str, str]],
) -> str:
    """Resolve a column's source type, handling dotted notation for joined satellites."""
    if "." in source_col:
        alias, col = source_col.split(".", 1)
        return joined_sat_types.get(alias, {}).get(col.lower(), "STRING")
    return primary_types.get(source_col.lower(), "STRING")


# ----------------------------------------------------------------------------
# Business Hub Helpers
# ----------------------------------------------------------------------------


def _build_source_hub_bk_df(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    source_hub: BusinessHubSourceConfig,
) -> DataFrame:
    """Build a source-hub DataFrame with source hash key + derived business BK.

    If source_hub.satellite is configured, joins the source hub to the current
    satellite row (ETL_EndDate IS NULL) to read xref / bk_source / bk_fallback.
    Otherwise reads bk_source directly from the hub table.

    Returns a DataFrame with:
      - {source_hub_hash_key}
      - __BusinessHubBk
    """
    hub_table: str = f"{config.target_catalog}.{config.source_schema}.{source_hub.hub}"
    hub_df = spark.table(hub_table)
    hub_df = _tenant_filter_source(hub_df, source_hub)
    hub_hash_key: str = _get_hash_key_column(hub_df, source_hub.hub)

    if source_hub.satellite:
        sat_table: str = f"{config.target_catalog}.{config.source_schema}.{source_hub.satellite}"
        sat_df = spark.table(sat_table)
        if "ETL_EndDate" not in sat_df.columns:
            raise ValueError(
                f"Business hub source satellite '{source_hub.satellite}' must include ETL_EndDate to identify current records"
            )
        sat_df = sat_df.filter(f.col("ETL_EndDate").isNull())
        sat_df = _tenant_filter_source(sat_df, source_hub)
        working_df = hub_df.join(sat_df, on=hub_hash_key, how="inner")
    else:
        working_df = hub_df

    bk_expr = f.col(source_hub.bk_source).cast("string")
    if source_hub.bk_fallback:
        bk_expr = f.coalesce(bk_expr, f.col(source_hub.bk_fallback).cast("string"))
    if source_hub.bk_prefix:
        bk_expr = f.concat_ws("|", f.lit(source_hub.bk_prefix), bk_expr)

    return (
        working_df
        .select(
            f.col(hub_hash_key),
            bk_expr.alias("__BusinessHubBk"),
        )
        .filter(f.col("__BusinessHubBk").isNotNull())
        .distinct()
    )


def _build_business_hub_df(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    bhub: BusinessHubConfig,
) -> DataFrame:
    """Build a conformed business hub DataFrame from all configured source hubs."""
    source_dfs: list = []
    for source_hub in bhub.source_hubs:
        source_df = _build_source_hub_bk_df(spark, config, source_hub)
        source_dfs.append(source_df.select("__BusinessHubBk"))

    if not source_dfs:
        raise ValueError(f"Business hub '{bhub.table_name}' has no source hubs")

    combined_df = source_dfs[0]
    for df in source_dfs[1:]:
        combined_df = combined_df.unionByName(df)

    deduped_df = combined_df.dropDuplicates(["__BusinessHubBk"])
    bhub_hash_expr = f.md5(f.concat_ws("||", f.col("__BusinessHubBk")))

    return deduped_df.select(
        bhub_hash_expr.alias(bhub.hash_key),
        f.col("__BusinessHubBk").alias(bhub.bk_column),
    )


def _build_same_as_link_df(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    bhub: BusinessHubConfig,
    source_hub: BusinessHubSourceConfig,
) -> DataFrame:
    """Build a same-as link DataFrame connecting one source hub to the bhub."""
    source_df = _build_source_hub_bk_df(spark, config, source_hub)
    source_hash_key = next(c for c in source_df.columns if c != "__BusinessHubBk")
    bhub_hash_expr = f.md5(f.concat_ws("||", f.col("__BusinessHubBk")))

    return source_df.select(
        f.md5(
            f.concat_ws(
                "||",
                f.col(source_hash_key),
                bhub_hash_expr,
                f.lit(source_hub.source_system),
                f.lit(source_hub.brand),
                f.lit(source_hub.region),
            )
        ).alias("LinkHashKey"),
        f.col(source_hash_key),
        bhub_hash_expr.alias(bhub.hash_key),
    ).distinct()


# ----------------------------------------------------------------------------
# Business Link Helpers
# ----------------------------------------------------------------------------

def _read_source_link_df(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    source_link,
) -> DataFrame:
    """Read a raw vault link table, optionally filtered through its effectivity satellite.

    If the source link defines an effectivity_satellite, INNER JOINs to the effsat
    on LinkHashKey where IsActive=TRUE and ETL_EndDate IS NULL, keeping only currently
    active relationships. Then applies the standard tenant filter.
    """

    source_table: str = f"{config.target_catalog}.{config.source_schema}.{source_link.table_name}"
    df = spark.table(source_table)

    if source_link.effectivity_satellite:
        effsat_table: str = f"{config.target_catalog}.{config.source_schema}.{source_link.effectivity_satellite}"
        effsat_df = (
            spark.table(effsat_table)
            .filter(
                (f.col("IsActive") == f.lit(True)) & f.col("ETL_EndDate").isNull()
            )
            .select("LinkHashKey")
        )
        df = df.join(effsat_df, on="LinkHashKey", how="inner")

    return _tenant_filter(df, config)


def _build_business_link_df(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    blink: BusinessLinkConfig,
) -> DataFrame:
    """Build a derived business link DataFrame by joining two source links.

    Reads both source links (with optional effsat filtering), slims each to
    its hub key columns, INNER JOINs on the shared join_key, then selects the
    two output hub keys and computes LinkHashKey.

    Returns a DataFrame with columns: LinkHashKey, output_hub_key_1, output_hub_key_2.
    """

    df1 = _read_source_link_df(spark, config, blink.source_links[0])
    df2 = _read_source_link_df(spark, config, blink.source_links[1])

    # Slim to hub keys only, deduplicate
    sl1_keys: list[str] = blink.source_links[0].hub_keys
    sl2_keys: list[str] = blink.source_links[1].hub_keys

    df1_slim = df1.select(*sl1_keys).distinct()
    df2_slim = df2.select(*sl2_keys).distinct()

    # INNER JOIN on the shared hub key — Spark merges the join column
    joined = df1_slim.join(df2_slim, on=blink.join_key, how="inner")

    # Select output hub keys and compute LinkHashKey
    key1, key2 = blink.output_hub_keys
    return joined.select(
        f.md5(
            f.concat_ws(
                "||",
                f.col(key1),
                f.col(key2),
                f.lit(config.source_system),
                f.lit(config.brand),
                f.lit(config.region),
            )
        ).alias("LinkHashKey"),
        f.col(key1),
        f.col(key2),
    ).distinct()


def _build_column_expression(df: DataFrame, attribute: BusinessAttributeConfig):
    """Build a Spark column expression for a configured attribute.

    Column references that use dotted notation (``alias.Column``) are resolved
    to the internal ``__js_{alias}__{Column}`` names produced by
    ``_build_enrichment_df``.
    """

    col_name: str = attribute.source_column or attribute.target_column
    resolved_name: str = _resolve_column_ref(col_name)
    expr = f.col(resolved_name)
    dtype = df.schema[resolved_name].dataType if resolved_name in df.columns else None

    for step in attribute.transforms:
        transform = get_transform(step.name)

        if step.name == "normalize_state_province":
            country_column = step.args.get("country_column")
            if not country_column:
                raise ValueError(
                    f"Attribute '{attribute.target_column}' transform 'normalize_state_province' requires 'country_column'"
                )
            expr = transform(expr, f.col(_resolve_column_ref(country_column)))
            continue

        if step.name == "concat_ws":
            columns = step.args.get("columns", [])
            if not columns:
                raise ValueError(
                    f"Attribute '{attribute.target_column}' transform 'concat_ws' requires 'columns'"
                )
            separator = step.args.get("separator", " ")
            expr = f.concat_ws(separator, *[f.col(_resolve_column_ref(column_name)) for column_name in columns])
            continue

        if step.name == "address_to_key":
            columns = step.args.get("columns", [])
            if len(columns) != 6:
                raise ValueError(
                    f"Attribute '{attribute.target_column}' transform 'address_to_key' requires 6 'columns' "
                    "(street, street2, city, state, postal, country)"
                )
            expr = transform(*[f.col(_resolve_column_ref(column_name)) if column_name is not None else f.lit("") for column_name in columns])
            continue

        if step.name == "plan_rate_to_key":
            columns = step.args.get("columns", [])
            if len(columns) != 2:
                raise ValueError(
                    f"Attribute '{attribute.target_column}' transform 'plan_rate_to_key' requires 2 'columns' "
                    "(currency, date)"
                )
            extra_args = {k: v for k, v in step.args.items() if k != "columns"}
            result = transform(f.col(_resolve_column_ref(columns[0])), f.col(_resolve_column_ref(columns[1])), **extra_args)
            if isinstance(result, tuple):
                expr, _ = result
            else:
                expr = result
            continue

        result = transform(expr, dtype=dtype, **step.args)
        if isinstance(result, tuple):
            expr, _ = result
        else:
            expr = result

    if not attribute.is_nullable:
        expr = f.when(expr.isNull(), f.lit("")).otherwise(expr)

    return expr.alias(attribute.target_column)


def build_satellite_dataframe(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    satellite_name: str,
) -> DataFrame:
    """Build the transformed business satellite DataFrame for one entity.

    Only attributes with is_active=True are included. Inactive attributes
    are silently skipped so they can be disabled in YAML or metadata tables
    without breaking the load pipeline.

    Tenant columns (ETL_SourceSystem, ETL_Brand, ETL_Region) are automatically
    passed through from the source satellite and included in the ETL_HashDiff.
    Source rows are filtered to the configured source_system, brand, and region
    before any transformation is applied.
    """

    satellite: BusinessSatelliteEntityConfig | None = next((sat for sat in config.satellites if sat.table_name == satellite_name), None)
    if satellite is None:
        raise ValueError(f"Business satellite '{satellite_name}' not found in config")

    active_attributes: list[BusinessAttributeConfig] = [attr for attr in satellite.attributes if attr.is_active]
    if not active_attributes:
        raise ValueError(
            f"Business satellite '{satellite_name}' has no active attributes. "
            "Set is_active: true on at least one attribute."
        )

    source_table: str = f"{config.target_catalog}.{config.source_schema}.{satellite.source_table}"

    # Hub-based sources (is_hub_source=True) do not have tenant columns, ETL_EndDate,
    # or ETL_RecordStatus. All attribute data arrives via joined_satellites.
    if not satellite.is_hub_source:
        _validate_source_columns(spark, source_table, satellite.table_name)

    source_df = spark.table(source_table)
    filtered_df = source_df.filter(satellite.filter)

    if satellite.is_hub_source:
        # Hub rows are never versioned — all rows are current by definition.
        working_df = filtered_df
    else:
        if "ETL_EndDate" not in filtered_df.columns:
            raise ValueError(
                f"Business satellite source '{satellite.source_table}' must include ETL_EndDate to identify current records"
            )
        working_df = filtered_df.filter(f.col("ETL_EndDate").isNull())
        working_df = _tenant_filter(working_df, config)

    # Enrich with columns from joined satellites (if any)
    enrichment_df = _build_enrichment_df(spark, config, satellite)
    if enrichment_df is not None:
        working_df = working_df.join(
            enrichment_df,
            on=satellite.parent_key_column,
            how="left",
        )

    # ETL_RecordStatus: for hub sources there is no record status column on the
    # source table — inject a static 'active' value since hub rows are never deleted.
    record_status_expr = (
        f.lit("active") if satellite.is_hub_source else f.col("ETL_RecordStatus")
    )

    select_exprs: list = [
        f.coalesce(
            f.col(satellite.parent_key_column),
            f.md5(f.lit(_NOT_AVAILABLE_SENTINEL_ID)),
        ).alias(satellite.parent_key_column),
        f.current_timestamp().alias("ETL_LoadDate"),
        f.lit(config.record_source).alias("ETL_RecordSource"),
        record_status_expr.alias("ETL_RecordStatus"),
    ]
    # Pass through required tenant columns.
    # For hub sources, inject config-level values since the hub has none.
    _tenant_col_map: dict[str, str] = {
        "ETL_SourceSystem": config.source_system,
        "ETL_Brand": config.brand,
        "ETL_Region": config.region,
    }
    for col in REQUIRED_TENANT_COLUMNS:
        if satellite.is_hub_source:
            select_exprs.append(f.lit(_tenant_col_map.get(col)).alias(col))
        else:
            select_exprs.append(f.col(col))

    select_exprs.extend(
        _build_column_expression(working_df, attribute)
        for attribute in active_attributes
    )

    transformed_df = working_df.select(*select_exprs)

    # Include tenant columns and ETL_RecordStatus in hash_diff
    hash_columns: list[str] = [attribute.target_column for attribute in active_attributes]
    if "ETL_RecordStatus" not in hash_columns:
        hash_columns.append("ETL_RecordStatus")
    for col in REQUIRED_TENANT_COLUMNS:
        if col not in hash_columns:
            hash_columns.append(col)

    hash_expr: str = hash_diff("src", hash_columns)
    return transformed_df.alias("src").withColumn("ETL_HashDiff", f.expr(hash_expr))


def close_business_satellite_versions(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    satellite_name: Optional[str] = None,
) -> dict[str, int]:
    """Close out superseded business satellite versions by setting ETL_EndDate."""

    target_schema: str = f"{config.target_catalog}.{config.target_schema}"
    results: dict = {}

    satellites_to_close: list[BusinessSatelliteEntityConfig] = [sat for sat in config.satellites if sat.is_active]
    if satellite_name:
        satellites_to_close: list[BusinessSatelliteEntityConfig] = [sat for sat in satellites_to_close if sat.table_name == satellite_name]
        if not satellites_to_close:
            raise ValueError(f"Business satellite '{satellite_name}' not found in active config")

    for satellite in satellites_to_close:
        target_table: str = f"{target_schema}.{satellite.table_name}"

        sql: str = f"""
            MERGE INTO {target_table} AS target
            USING (
                SELECT {satellite.parent_key_column}, MAX(ETL_LoadDate) AS latest_load_date
                FROM {target_table}
                WHERE ETL_EndDate IS NULL
                GROUP BY {satellite.parent_key_column}
                HAVING COUNT(*) > 1
            ) AS src
            ON target.{satellite.parent_key_column} = src.{satellite.parent_key_column}
                AND target.ETL_EndDate IS NULL
                AND target.ETL_LoadDate < src.latest_load_date
            WHEN MATCHED THEN UPDATE SET ETL_EndDate = current_timestamp()
        """

        result = spark.sql(sql)
        rows = result.first()["num_affected_rows"]
        results[satellite.table_name] = rows
        if rows > 0:
            print(f"  Business satellite {satellite.table_name}: {rows} previous versions closed")

    return results


def create_business_satellite_tables(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
) -> list[str]:
    """Create business satellite target tables if they do not exist.

    Mirrors the create_vault_tables pattern from datavault_util.ddl_generator.
    Runs CREATE TABLE IF NOT EXISTS for every active satellite so the loader
    can always INSERT without a prior manual DDL step.

    Required tenant columns (ETL_SourceSystem, ETL_Brand, ETL_Region) are
    automatically appended after business attribute columns.

    Args:
        spark: Active SparkSession.
        config: Validated BusinessSatelliteConfig.

    Returns:
        List of table names processed.
    """
    target_schema: str = f"{config.target_catalog}.{config.target_schema}"
    created: list = []

    # Create schema if not exists
    spark.sql(f"CREATE SCHEMA IF NOT EXISTS {target_schema}")

    tenant_cols = "ETL_SourceSystem, ETL_Brand, ETL_Region"

    for satellite in config.satellites:
        if not satellite.is_active:
            continue

        source_table: str = f"{config.target_catalog}.{config.source_schema}.{satellite.source_table}"
        source_types: dict[str, str] = get_table_column_types(spark, source_table)

        # Collect column types from joined satellites for dotted source_column refs
        joined_sat_types: dict[str, dict[str, str]] = {}
        for js in satellite.joined_satellites:
            js_table: str = f"{config.target_catalog}.{config.source_schema}.{js.satellite}"
            joined_sat_types[js.alias] = get_table_column_types(spark, js_table)

        active_attributes: list[BusinessAttributeConfig] = [attr for attr in satellite.attributes if attr.is_active]
        cols: list[str] = [f"{satellite.parent_key_column} STRING NOT NULL"]
        cols.append("ETL_LoadDate TIMESTAMP NOT NULL")
        cols.append("ETL_EndDate TIMESTAMP")
        cols.append("ETL_HashDiff STRING NOT NULL")
        cols.append("ETL_RecordSource STRING NOT NULL")
        cols.append("ETL_RecordStatus STRING")
        for attr in active_attributes:
            source_col: str = attr.source_column or attr.target_column
            col_type: str = attr.output_type or _resolve_source_type(
                source_col, source_types, joined_sat_types
            )
            cols.append(f"{attr.target_column} {col_type}")
        # Required tenant columns (appended after business attribute columns)
        for col in REQUIRED_TENANT_COLUMNS:
            cols.append(f"{col} STRING")

        col_def: str = ",\n                ".join(cols)
        cluster_cols: str = f"{tenant_cols}, {satellite.parent_key_column}"
        stats_cols: str = f"{cluster_cols}, ETL_LoadDate, ETL_EndDate"
        ddl: str = f"""
            CREATE TABLE IF NOT EXISTS {target_schema}.{satellite.table_name} (
                {col_def}
            )
            CLUSTER BY ({cluster_cols})
            TBLPROPERTIES (
                'delta.dataSkippingStatsColumns' = '{stats_cols}',
                'delta.columnMapping.mode' = 'name'
            )
        """
        spark.sql(ddl)
        created.append(satellite.table_name)

    print(f"Created {len(created)} business satellite tables: {', '.join(created)}")
    return created


def create_business_link_tables(
