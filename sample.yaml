      # AddressKey hashes the RAW vault columns (address_to_key normalizes them itself).
      # GoCanvas has no StateCode/CountryCode fields - names are converted by normalize_state_province.
      - target_column: ContactMailingAddressKey
        description: Contact mailing AddressKey for dim_addresses - MD5 of the normalized address (address_to_key).
        is_active: true
        transforms:
          - name: address_to_key
            args:
              columns: [ContactMailingStreet, null, ContactMailingCity, ContactMailingState, ContactMailingPostalCode, ContactMailingCountry]

      - target_column: ContactMailingStreetNormalized
        source_column: ContactMailingStreet
        description: ''
        is_active: true
        transforms:
          - name: trim
          - name: normalize_street_address
          - name: default_values

      - target_column: ContactMailingStreet2Normalized
        description: Contact mailing street line 2 for dim_addresses. Salesforce has no second street field, so always 'Not Available' (same as a blank Chargebee line 2).
        is_active: true
        transforms:
          - name: literal
            args:
              value: Not Available

