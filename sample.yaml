def load_business_link_effectivity_satellites(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
    link_name: Optional[str] = None,
) -> dict[str, int]:
    """Auto-create and load effectivity satellites for business links.

    Patterns 1 and 2 both receive an effectivity satellite with identical
    logic — driving key deduplication is handled at the raw vault level,
    so the business link effsat simply tracks whether each derived
    combination is currently active or not.

    Pattern 3 (immutable) has no effectivity satellite.

    For each qualifying business link:
    1. Auto-create the effsat table if it doesn't exist.
    2. Build the expected current set from source links (with effsat filtering).
    3. Compare against current open effsat rows.
    4. INSERT activation/deactivation state changes.
    5. Close superseded effsat versions.
    """

    target_schema: str = f"{config.target_catalog}.{config.target_schema}"
    results: dict = {}

    links_to_process: list[BusinessLinkConfig] = [
        bl for bl in config.business_links
        if bl.is_active and bl.relationship_pattern in (1, 2)
    ]
    if link_name:
        links_to_process: list[BusinessLinkConfig] = [bl for bl in links_to_process if bl.table_name == link_name]

    for blink in links_to_process:
        effsat_name: str = f"{config.source_system}_effsat_{blink.table_name}_{config.brand}".lower()
        effsat_table: str = f"{target_schema}.{effsat_name}"

        # Auto-create the effsat table
        tenant_cols = "ETL_SourceSystem, ETL_Brand, ETL_Region"
        spark.sql(f"""
            CREATE TABLE IF NOT EXISTS {effsat_table} (
                LinkHashKey STRING NOT NULL,
                IsActive BOOLEAN NOT NULL,
                ETL_SourceSystem STRING,
                ETL_Brand STRING,
                ETL_Region STRING,
                ETL_LoadDate TIMESTAMP NOT NULL,
                ETL_RecordSource STRING NOT NULL,
                ETL_EndDate TIMESTAMP
            )
            CLUSTER BY ({tenant_cols}, LinkHashKey)
            TBLPROPERTIES (
                'delta.columnMapping.mode' = 'name'
            )
        """)

        # Build expected current set from source links
        expected_df = _build_business_link_df(spark, config, blink)
        expected_view: str = f"expected_{blink.table_name}"
        expected_df.createOrReplaceTempView(expected_view)

        # Compare expected vs current open effsat and insert state changes
        sql: str = f"""
            WITH current_active AS (
                SELECT LinkHashKey
                FROM {effsat_table}
                WHERE IsActive = TRUE AND ETL_EndDate IS NULL
                    AND ETL_SourceSystem = '{config.source_system}'
                    AND ETL_Brand = '{config.brand}'
                    AND ETL_Region = '{config.region}'
            ),
            activations AS (
                SELECT e.LinkHashKey, TRUE AS IsActive
                FROM {expected_view} e
                LEFT JOIN current_active ca ON ca.LinkHashKey = e.LinkHashKey
                WHERE ca.LinkHashKey IS NULL
            ),
            deactivations AS (
                SELECT ca.LinkHashKey, FALSE AS IsActive
                FROM current_active ca
                LEFT JOIN {expected_view} e ON e.LinkHashKey = ca.LinkHashKey
                WHERE e.LinkHashKey IS NULL
            ),
            changes AS (
                SELECT * FROM activations
                UNION ALL
                SELECT * FROM deactivations
            )
            INSERT INTO {effsat_table}
                (LinkHashKey, IsActive, ETL_SourceSystem, ETL_Brand, ETL_Region,
                 ETL_LoadDate, ETL_RecordSource, ETL_EndDate)
            SELECT
                c.LinkHashKey,
                c.IsActive,
                '{config.source_system}',
                '{config.brand}',
                '{config.region}',
                current_timestamp(),
                '{config.record_source}',
                CAST(NULL AS TIMESTAMP)
            FROM changes c
        """

        result = spark.sql(sql)
        rows = result.first()["num_affected_rows"]
        results[effsat_name] = rows

        # Close superseded effsat versions
        spark.sql(f"""
            MERGE INTO {effsat_table} AS target
            USING (
                SELECT LinkHashKey, MAX(ETL_LoadDate) AS latest_load_date
                FROM {effsat_table}
                WHERE ETL_EndDate IS NULL
                    AND ETL_SourceSystem = '{config.source_system}'
                    AND ETL_Brand = '{config.brand}'
                    AND ETL_Region = '{config.region}'
                GROUP BY LinkHashKey
                HAVING COUNT(*) > 1
            ) AS src
            ON target.LinkHashKey = src.LinkHashKey
                AND target.ETL_EndDate IS NULL
                AND target.ETL_LoadDate < src.latest_load_date
                AND target.ETL_SourceSystem = '{config.source_system}'
                AND target.ETL_Brand = '{config.brand}'
                AND target.ETL_Region = '{config.region}'
            WHEN MATCHED THEN UPDATE SET ETL_EndDate = current_timestamp()
        """)

        if rows > 0:
            print(f"  Business link effsat {effsat_name}: {rows} state changes recorded")
        else:
            print(f"  Business link effsat {effsat_name}: no state changes")

    return results


def run_business_links(
    spark: SparkSession,
    config_path: str,
    link_name: Optional[str] = None,
    catalog_name: Optional[str] = None,
) -> dict[str, int]:
    """Standalone entry point for business link processing.

    Parses config from YAML, ensures target tables exist and schemas are
    evolved, then loads business links and their effectivity satellites.

    Args:
        spark: Active SparkSession.
        config_path: Workspace path to the business satellite YAML config.
        link_name: Optional specific business link table_name to load.
        catalog_name: Optional catalog override (for cross-env deployment).
    """

    config: BusinessSatelliteConfig = load_business_satellite_config(config_path)
    if catalog_name:
        config.target_catalog = catalog_name

    if not config.business_links:
        print("No business links defined in config - skipping.")
        return {}

    create_business_link_tables(spark, config)
    evolve_business_link_schemas(spark, config)
    results: dict[str, int] = load_business_links(spark, config, link_name=link_name)
    load_business_link_effectivity_satellites(spark, config, link_name=link_name)
    return results


def run(
    spark: SparkSession,
    config_path: str,
    satellite_name: Optional[str] = None,
    catalog_name: Optional[str] = None,
) -> dict[str, int]:
    """YAML-direct runner entrypoint.

    Parses config from YAML, ensures target tables exist and schemas are
    evolved, then loads business hubs, business satellites, and business links.

    When satellite_name is specified, only that satellite is loaded and
    business hubs / business links are skipped. Use run_business_hubs() or
    run_business_links() for selective execution.

    Args:
        spark: Active SparkSession.
        config_path: Workspace path to the business satellite YAML config.
        satellite_name: Optional specific satellite table_name to load.
        catalog_name: Optional catalog override (for cross-env deployment).
                      If provided, overrides config.target_catalog.
    """

    config: BusinessSatelliteConfig = load_business_satellite_config(config_path)
    if catalog_name:
        config.target_catalog = catalog_name

    result: dict = {}

    # Business hubs (only when running full pipeline, not selective satellite)
    if config.business_hubs and not satellite_name:
        bhub_result: dict[str, int] = run_business_hubs(
            spark,
            config_path=config_path,
            catalog_name=catalog_name,
        )
        result.update(bhub_result)

    # Satellites
    create_business_satellite_tables(spark, config)
    evolve_business_satellite_schemas(spark, config)
    sat_result: dict[str, int] = load_business_satellites(spark, config, satellite_name=satellite_name)
    result.update(sat_result)

    # Business links (only when running full pipeline, not selective satellite)
    if config.business_links and not satellite_name:
        create_business_link_tables(spark, config)
        evolve_business_link_schemas(spark, config)
        blink_result: dict[str, int] = load_business_links(spark, config)
        load_business_link_effectivity_satellites(spark, config)
        result.update(blink_result)

    return result
