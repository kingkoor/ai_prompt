def evolve_business_satellite_schemas(
    spark: SparkSession,
    config: BusinessSatelliteConfig,
) -> list[str]:
    """Evolve business satellite table schemas to match current config.

    Adds columns for new active attributes, ensures ETL_RecordStatus exists,
    and adds required tenant columns (ETL_SourceSystem, ETL_Brand, ETL_Region)
    to tables created before tenant support was introduced.

    Mirrors the evolve_satellite_schemas pattern from datavault_util.ddl_generator.

    Args:
        spark: Active SparkSession.
        config: Validated BusinessSatelliteConfig.

    Returns:
        List of evolution descriptions applied.
    """
    target_schema: str = f"{config.target_catalog}.{config.target_schema}"
    evolved: list = []

    for satellite in config.satellites:
        if not satellite.is_active:
            continue

        sat_table: str = f"{target_schema}.{satellite.table_name}"
        try:
            existing_fields: dict = {
                field.name.lower(): field.dataType.simpleString()
                for field in spark.table(sat_table).schema.fields
            }
        except Exception:
            continue  # Table doesn't exist yet; create_business_satellite_tables handles it

        source_table: str = f"{config.target_catalog}.{config.source_schema}.{satellite.source_table}"
        source_types: dict[str, str] = get_table_column_types(spark, source_table)

        # Collect column types from joined satellites for dotted source_column refs
        joined_sat_types: dict[str, dict[str, str]] = {}
        for js in satellite.joined_satellites:
            js_table: str = f"{config.target_catalog}.{config.source_schema}.{js.satellite}"
            joined_sat_types[js.alias] = get_table_column_types(spark, js_table)

        new_cols: list = []
        retyped_cols: list = []

        # Ensure ETL_RecordStatus exists (for tables created before this column was added)
        if "etl_recordstatus" not in existing_fields:
            new_cols.append("ETL_RecordStatus STRING")

        # Check for new active attribute columns, or existing ones whose source type changed
        for attr in satellite.attributes:
            if not attr.is_active:
                continue

            source_col: str = attr.source_column or attr.target_column
            source_type: str = attr.output_type or _resolve_source_type(
                source_col, source_types, joined_sat_types
            )
            existing_type = existing_fields.get(attr.target_column.lower())

            if existing_type is None:
                new_cols.append(f"{attr.target_column} {source_type}")
            elif existing_type.lower() != source_type.lower():
                retyped_cols.append((attr.target_column, existing_type, source_type))

        #required tenant columns (for tables created before tenant support was added)
        for col in REQUIRED_TENANT_COLUMNS:
            if col.lower() not in existing_fields:
                new_cols.append(f"{col} STRING")

        if new_cols:
            cols_ddl = ", ".join(new_cols)
            spark.sql(f"ALTER TABLE {sat_table} ADD COLUMNS ({cols_ddl})")
            evolved.append(f"{satellite.table_name} (+{[c.split()[0] for c in new_cols]})")

        for target_col, old_type, new_type in retyped_cols:
            try:
                spark.sql(
                    f"ALTER TABLE {sat_table} ALTER COLUMN {target_col} TYPE {new_type}"
                )
                evolved.append(f"{satellite.table_name} ({target_col}: {old_type} -> {new_type})")
            except Exception as e:
                print(
                    f"  WARNING: could not change {satellite.table_name}.{target_col} from "
                    f"{old_type} to {new_type} (source type changed): {e}. "
                    f"Delta only supports widening type changes - a manual migration "
                    f"may be required for this column."
                )

    if evolved:
        print(f"Schema evolution applied: {', '.join(evolved)}")
    else:
        print("No schema evolution needed - all tables match config.")

    return evolved


