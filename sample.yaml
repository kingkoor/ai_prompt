#---------------------------------
# FACTS
#---------------------------------------------

  - table_name: salesforce_fact_orders
    table_type: fact
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_orders
    key_column: OrderKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_bsat_orders_bluebeam_us
        satellite_type: business
        columns:
          - source: OrderActivatedDateKey
          - source: OrderEffectiveDateKey
          - source: OrderEndDateKey
          - source: OrderCreatedDateKey
          - source: OrderCurrencyKey
          # Measures
          - source: OrderTotalAmount

    foreign_keys:
      - link: salesforce_link_order_account
        hub_key: HubAccountHashKey
        fk_column: AccountKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_order_account_bluebeam
        join_type: LEFT
      - link: salesforce_link_order_opportunity
        hub_key: HubOpportunityHashKey
        fk_column: OpportunityKey
        driving_key: false
        effectivity_satellite: salesforce_effsat_salesforce_link_order_opportunity_bluebeam
        join_type: LEFT
      - link: salesforce_link_order_activated_by
        hub_key: HubUserHashKey
        fk_column: ActivatedByUserKey
        driving_key: false
        join_type: LEFT
      - link: salesforce_link_order_owner
        hub_key: HubUserHashKey
        fk_column: OwnerUserKey
        driving_key: false
        join_type: LEFT
      - link: salesforce_link_order_ship_to_contact
        hub_key: HubContactHashKey
        fk_column: ShipToContactKey
        driving_key: false
        join_type: LEFT
      - link: salesforce_link_order_bill_to_contact
        hub_key: HubContactHashKey
        fk_column: BillToContactKey
        driving_key: false
        join_type: LEFT


