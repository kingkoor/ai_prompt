# Gold Layer Configuration - Salesforce (Nexus / Bluebeam US)
# See README.md in this directory for documentation on load types, satellite types,
# restricted table rules, foreign key resolution strategies, and bridge tables.
# Run sync_gold_metadata_runner.py to push changes into the metadata tables.
#
# DESIGN RULES:
# 1. Column names keep their silver entity-prefix as-is (no aliasing).
# 2. If a column exists in both vault sat and business sat, source from bsat.
# 3. Tables are built one-by-one matching the Fabric gold layer definitions.

source_system: salesforce
brand: Bluebeam
region: US
target_catalog: bbdatawarehouse_dev
source_schema: silver
target_schema: gold

tables:

# -----------------------------
# DIMENSIONS
#----------------------------

  - table_name: salesforce_dim_accounts
    table_type: dim
    load_type: active
    load_mode: full_refresh
    hub: salesforce_hub_accounts
    key_column: AccountKey
    filter: "1=1"
    is_active: true
    satellites:
      - name: salesforce_sat_accounts_bluebeam_us
        satellite_type: vault
        columns:
          - source: AccountActiveSubscription
          - source: AccountConvertedFromLead
          - source: AccountCurrencyIsoCode
          - source: AccountIsCustomerPortal
          - source: AccountIsPartner
          - source: AccountOwnerName
          - source: AccountIsStrategic
          - source: AccountIsTest
      - name: salesforce_bsat_accounts_bluebeam_us   # added - ID columns now sourced from bsat (NULL -> 'Not Available')
        satellite_type: business
        columns:
          - source: AccountExternalId
          - source: AccountId18
          - source: AccountCSMOwnerId
          - source: AccountLegacySalesforceId
          - source: AccountLicensingId
          - source: AccountNetsuiteExternalId
          - source: AccountOwnerId
          - source: AccountParentId
          - source: AccountResellerId
          - source: AccountUltimateParentId
          - source: AccountAnnualRevenue
          - source: AccountChannelDiscountNewBusiness
          - source: AccountNumberOfEmployees
          - source: AccountUpcomingAutoRenewals
          - source: AccountUpcomingSubscriptions
          - source: AccountSubsidiary
          - source: AccountTier
          - source: AccountRecordTypeName
          - source: AccountSource
          - source: AccountAutoCharge
          - source: AccountAutoQuoted
          - source: AccountAutoRenewOptOutReason
          - source: AccountChannelProgramLevelName
          - source: AccountChannelProgramName
          - source: AccountCompanySize
          - source: AccountHealth
          - source: AccountCSMOwnerName
          - source: AccountIndustry
          - source: AccountIsPartnerAccount
          - source: AccountPartnerName
          - source: AccountPartnerLevel
          - source: AccountRegion
          - source: AccountSellingSubTeam
          - source: AccountSellingTeam
          - source: AccountStatus
          - source: AccountSubIndustry
          - source: AccountType
          - source: AccountCreatedDate
          - source: AccountSystemModstamp
      - name: salesforce_bsat_accounts_restricted_bluebeam_us
        satellite_type: business
        columns:
          - source: AccountNameNormalized
          - source: AccountSearchDisplay
      # added at Sep 8 - de-duplicated parent from account matching.
      # Sits alongside AccountParentId (raw Salesforce) and
      # AccountUltimateParentId, and is treated the same way.
      - name: salesforce_bsat_account_matching_bluebeam_us
        satellite_type: business
        columns:
          - source: AccountEDWParentId

